name: "Build & Package Lapis Game"
description: "Composite GitHub Action to install Crystal, cache shards, compile Lapis game shared libraries, run crystal spec, package standalone Godot 4.8 executables & PCK archives across Linux, Windows, and macOS, and execute headless verification."
author: "Sol-Vin AI Organization (Gamma)"

inputs:
  working-directory:
    description: "Working directory of the Lapis game project (defaults to '.' or 'template' inside sol-vin/lapis)"
    required: false
    default: "."
  game-name:
    description: "Explicit game binary and package name (auto-detected from shard.yml or project.godot if empty)"
    required: false
    default: ""
  entry-point:
    description: "Crystal source entrypoint for the game shared library"
    required: false
    default: "src/main.cr"
  crystal-version:
    description: "Crystal compiler version to install"
    required: false
    default: "1.21.0"
  godot-version:
    description: "Target Godot Engine version (resolved from godot-version.yml or defaults to 4.8-dev7)"
    required: false
    default: ""
  release:
    description: "Compile game shared library and package in --release mode"
    required: false
    default: "false"
  package-game:
    description: "Package standalone playable game executable, .pck resource pack, and distribution .zip archive"
    required: false
    default: "true"
  embed-pck:
    description: "Embed Godot .pck resource pack into standalone game executable using GDPC footer"
    required: false
    default: "true"
  portable:
    description: "Generate additional portable single-directory game .zip archive"
    required: false
    default: "false"
  run-specs:
    description: "Run crystal spec unit test suite"
    required: false
    default: "true"
  run-headless:
    description: "Run Godot 4.8 headless scene/script verification smoke test"
    required: false
    default: "true"
  run-benchmarks:
    description: "Run game project benchmark suite if benchmarks/ or bench/ exists"
    required: false
    default: "true"
  install-libvlc:
    description: "Install LibVLC runtime dependencies ('auto', 'true', or 'false')"
    required: false
    default: "auto"
  extra-apt-packages:
    description: "Additional APT packages to install on Linux runners"
    required: false
    default: ""
  extra-brew-packages:
    description: "Additional Homebrew packages to install on macOS runners"
    required: false
    default: ""

outputs:
  game-name:
    description: "Resolved Lapis game binary/package name"
    value: ${{ steps.meta.outputs.game_name }}
  godot-version:
    description: "Resolved target Godot Engine version"
    value: ${{ steps.meta.outputs.godot_version }}
  shard-version:
    description: "Resolved game version from shard.yml"
    value: ${{ steps.meta.outputs.shard_version }}
  game-library-path:
    description: "Path to the compiled game shared library (.dll, .so, .dylib)"
    value: ${{ steps.validate.outputs.game_library_path }}
  bridge-library-path:
    description: "Path to the compiled or staged crystal_bridge shared library"
    value: ${{ steps.validate.outputs.bridge_library_path }}
  game-executable-path:
    description: "Path to the packaged standalone game executable"
    value: ${{ steps.validate.outputs.game_executable_path }}
  game-pck-path:
    description: "Path to the generated Godot .pck resource pack"
    value: ${{ steps.validate.outputs.game_pck_path }}
  package-archive-path:
    description: "Path to the packaged distribution .zip archive"
    value: ${{ steps.validate.outputs.package_archive_path }}

runs:
  using: "composite"
  steps:
    - name: Resolve Game & Godot 4.8 Metadata
      id: meta
      shell: bash
      run: |
        WORK_DIR="${{ inputs.working-directory }}"
        if [ -z "$WORK_DIR" ]; then WORK_DIR="."; fi
        if [ "$WORK_DIR" = "." ] && [ -f "src/libgodot.cr" ] && [ -d "template" ] && [ -f "template/project.godot" ]; then
          WORK_DIR="template"
        fi
        echo "work_dir=$WORK_DIR" >> "$GITHUB_OUTPUT"
        echo "LAPIS_GAME_WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"

        GODOT_VER="${{ inputs.godot-version }}"
        if [ -z "$GODOT_VER" ] && [ -f "$WORK_DIR/godot-version.yml" ]; then
          GODOT_VER=$(sed -n 's/.*version:[[:space:]]*["'"'"']\?\([^"'"'"']\+\)["'"'"']\?.*/\1/p' "$WORK_DIR/godot-version.yml" | tr -d '\r\n[:space:]')
        fi
        if [ -z "$GODOT_VER" ] && [ -f "godot-version.yml" ]; then
          GODOT_VER=$(sed -n 's/.*version:[[:space:]]*["'"'"']\?\([^"'"'"']\+\)["'"'"']\?.*/\1/p' "godot-version.yml" | tr -d '\r\n[:space:]')
        fi
        if [ -z "$GODOT_VER" ]; then
          GODOT_VER="4.8-dev7"
        fi
        if [ ! -f "$WORK_DIR/godot-version.yml" ]; then
          echo "version: \"$GODOT_VER\"" > "$WORK_DIR/godot-version.yml"
        fi
        echo "godot_version=$GODOT_VER" >> "$GITHUB_OUTPUT"
        echo "GODOT_VERSION=$GODOT_VER" >> "$GITHUB_ENV"

        GAME_NAME="${{ inputs.game-name }}"
        SHARD_VER="0.1.0"
        if [ -f "$WORK_DIR/shard.yml" ]; then
          if [ -z "$GAME_NAME" ]; then
            GAME_NAME=$(awk '/^name:/ {print $2}' "$WORK_DIR/shard.yml" 2>/dev/null | tr -d ' "\r\n')
          fi
          PARSED_VER=$(awk '/^version:/ {print $2}' "$WORK_DIR/shard.yml" 2>/dev/null | tr -d ' "\r\n')
          if [ -n "$PARSED_VER" ]; then SHARD_VER="$PARSED_VER"; fi
        fi
        if [ -z "$GAME_NAME" ] && [ -f "$WORK_DIR/project.godot" ]; then
          GAME_NAME=$(sed -n 's/^config\/name="\([^"]*\)".*/\1/p' "$WORK_DIR/project.godot" 2>/dev/null | tr '[:upper:] -' '[:lower:]__' | tr -cd 'a-z0-9_')
        fi
        if [ -z "$GAME_NAME" ]; then
          GAME_NAME="game"
        fi
        echo "game_name=$GAME_NAME" >> "$GITHUB_OUTPUT"
        echo "shard_version=$SHARD_VER" >> "$GITHUB_OUTPUT"
        echo "LAPIS_GAME_NAME=$GAME_NAME" >> "$GITHUB_ENV"

        VLC_MODE="${{ inputs.install-libvlc }}"
        NEEDS_VLC="false"
        if [ "$VLC_MODE" = "true" ]; then
          NEEDS_VLC="true"
        elif [ "$VLC_MODE" = "auto" ]; then
          if [ -d "$WORK_DIR/addons/emerald" ] || [ -d "$WORK_DIR/ext/libvlc" ] || grep -qi "emerald" "$WORK_DIR/shard.yml" 2>/dev/null; then
            NEEDS_VLC="true"
          fi
        fi
        echo "needs_vlc=$NEEDS_VLC" >> "$GITHUB_OUTPUT"
        echo "LAPIS_NEEDS_VLC=$NEEDS_VLC" >> "$GITHUB_ENV"
        echo "Resolved Game: $GAME_NAME (v$SHARD_VER) | Target Godot: $GODOT_VER | Working Dir: $WORK_DIR | LibVLC: $NEEDS_VLC"

    - name: Install Linux Build Dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
        sudo apt-get update -y
        PKGS="lld make gcc g++ libgc-dev xvfb zip unzip wget curl python3"
        if [ "${{ steps.meta.outputs.needs_vlc }}" = "true" ]; then
          PKGS="$PKGS libvlc-dev vlc"
        fi
        if [ -n "${{ inputs.extra-apt-packages }}" ]; then
          PKGS="$PKGS ${{ inputs.extra-apt-packages }}"
        fi
        sudo apt-get install -y $PKGS

    - name: Install macOS Build Dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install bdw-gc || true
        if [ -n "${{ inputs.extra-brew-packages }}" ]; then
          brew install ${{ inputs.extra-brew-packages }} || true
        fi
        if [ "${{ steps.meta.outputs.needs_vlc }}" = "true" ]; then
          brew install --cask vlc || true
          VLC_LIB=$(find /Applications/VLC.app -name "libvlc*.dylib" 2>/dev/null | head -n 1)
          if [ -n "$VLC_LIB" ]; then
            VLC_DIR=$(dirname "$VLC_LIB")
            sudo mkdir -p /usr/local/lib /opt/homebrew/lib
            sudo ln -sf "$VLC_LIB" /usr/local/lib/libvlc.dylib
            sudo ln -sf "$VLC_LIB" /usr/local/lib/liblibvlc.dylib
            sudo ln -sf "$VLC_LIB" /opt/homebrew/lib/libvlc.dylib
            sudo ln -sf "$VLC_LIB" /opt/homebrew/lib/liblibvlc.dylib
            CORE_LIB=$(find /Applications/VLC.app -name "libvlccore*.dylib" 2>/dev/null | head -n 1)
            if [ -n "$CORE_LIB" ]; then
              sudo ln -sf "$CORE_LIB" /usr/local/lib/libvlccore.dylib
              sudo ln -sf "$CORE_LIB" /opt/homebrew/lib/libvlccore.dylib
            fi
            [ ! -f "$VLC_DIR/libvlc.dylib" ] && sudo ln -sf "$VLC_LIB" "$VLC_DIR/libvlc.dylib" 2>/dev/null || true
            [ ! -f "$VLC_DIR/liblibvlc.dylib" ] && sudo ln -sf "$VLC_LIB" "$VLC_DIR/liblibvlc.dylib" 2>/dev/null || true
            echo "CRYSTAL_LIBRARY_PATH=$VLC_DIR:/opt/homebrew/lib:/usr/local/lib" >> "$GITHUB_ENV"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$VLC_DIR:/opt/homebrew/lib:/usr/local/lib" >> "$GITHUB_ENV"
          fi
        fi

    - name: Install Windows Build Dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if ("${{ steps.meta.outputs.needs_vlc }}" -eq "true") {
          if (-not (Test-Path "C:\Program Files\VideoLAN\VLC\libvlc.dll")) {
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              choco install vlc -y --no-progress
              if (Test-Path "C:\Program Files\VideoLAN\VLC\libvlc.dll") { break }
              Start-Sleep -Seconds 2
            }
          }
          $workDir = "${{ steps.meta.outputs.work_dir }}"
          if (Test-Path "$workDir/ext/libvlc") {
            $vlcLib = (Resolve-Path "$workDir/ext/libvlc").Path
            "LIB=$vlcLib;$($env:LIB)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          "C:\Program Files\VideoLAN\VLC" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        }

    - name: Install Crystal Compiler
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ inputs.crystal-version }}

    - name: Cache Crystal Build & Shards
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/crystal
          ~\AppData\Local\crystal\cache
          ${{ steps.meta.outputs.work_dir }}/lib
        key: lapis-game-cache-${{ runner.os }}-${{ hashFiles('**/shard.yml', '**/shard.lock') }}
        restore-keys: |
          lapis-game-cache-${{ runner.os }}-

    - name: Install Shards & Stage Lapis Engine Integration
      shell: bash
      run: |
        WORK_DIR="${{ steps.meta.outputs.work_dir }}"
        if [ "$WORK_DIR" != "." ] && [ -f "shard.yml" ] && [ -f "src/lapis.cr" ]; then
          shards install --skip-postinstall || true
          mkdir -p "$WORK_DIR/lib" "$WORK_DIR/lib/lapis" "$WORK_DIR/addons/crystal_integration/bin"
          if [ -d "lib" ]; then
            cp -rn lib/* "$WORK_DIR/lib/" 2>/dev/null || cp -r lib/* "$WORK_DIR/lib/" 2>/dev/null || true
          fi
          cp -r src rsrc shard.yml godot-version.yml "$WORK_DIR/lib/lapis/"
          if [ -d "addons/crystal_integration" ]; then
            cp -r addons/crystal_integration/* "$WORK_DIR/addons/crystal_integration/"
          fi
        else
          (cd "$WORK_DIR" && (shards install --skip-postinstall || shards install || true))
          mkdir -p "$WORK_DIR/addons/crystal_integration/bin"
          if [ -d "$WORK_DIR/lib/lapis/addons/crystal_integration" ]; then
            cp -r "$WORK_DIR/lib/lapis/addons/crystal_integration/"* "$WORK_DIR/addons/crystal_integration/" 2>/dev/null || true
          fi
        fi

        if [ ! -f "$WORK_DIR/addons/crystal_integration/crystal.gdextension" ]; then
          {
            echo '[configuration]'
            echo 'entry_symbol = "crystal_library_init"'
            echo 'compatibility_minimum = "4.1"'
            echo 'reloadable = true'
            echo ''
            echo '[libraries]'
            echo 'linux.debug.x86_64 = "res://addons/crystal_integration/bin/crystal_bridge.so"'
            echo 'linux.release.x86_64 = "res://addons/crystal_integration/bin/crystal_bridge.so"'
            echo 'windows.debug.x86_64 = "res://addons/crystal_integration/bin/crystal_bridge.dll"'
            echo 'windows.release.x86_64 = "res://addons/crystal_integration/bin/crystal_bridge.dll"'
            echo 'macos.debug = "res://addons/crystal_integration/bin/crystal_bridge.dylib"'
            echo 'macos.release = "res://addons/crystal_integration/bin/crystal_bridge.dylib"'
            echo 'macos.debug.arm64 = "res://addons/crystal_integration/bin/crystal_bridge.dylib"'
            echo 'macos.release.arm64 = "res://addons/crystal_integration/bin/crystal_bridge.dylib"'
            echo 'macos.debug.x86_64 = "res://addons/crystal_integration/bin/crystal_bridge.dylib"'
            echo 'macos.release.x86_64 = "res://addons/crystal_integration/bin/crystal_bridge.dylib"'
          } > "$WORK_DIR/addons/crystal_integration/crystal.gdextension"
        fi

        mkdir -p "$WORK_DIR/.godot"
        find "$WORK_DIR/addons" -name "*.gdextension" 2>/dev/null | sed "s|^$WORK_DIR/|res://|;s|^\./|res://|" > "$WORK_DIR/.godot/extension_list.cfg"
        if [ ! -s "$WORK_DIR/.godot/extension_list.cfg" ]; then
          echo "res://addons/crystal_integration/crystal.gdextension" > "$WORK_DIR/.godot/extension_list.cfg"
        fi

    - name: Run Crystal Unit Specifications
      if: inputs.run-specs == 'true'
      shell: bash
      run: |
        cd "${{ steps.meta.outputs.work_dir }}"
        crystal -v
        crystal spec

    - name: Setup Godot Engine (${{ steps.meta.outputs.godot_version }})
      uses: appsinacup/action_setup_godot@main
      with:
        repo: godotengine/godot-builds
        version: ${{ steps.meta.outputs.godot_version }}
        enable_cache: true

    - name: Configure Godot, Compile & Package Lapis Game (Linux & macOS)
      if: runner.os == 'Linux' || runner.os == 'macOS'
      shell: bash
      run: |
        ROOT_DIR="$(pwd)"
        cd "${{ steps.meta.outputs.work_dir }}"
        GODOT_VER="${{ steps.meta.outputs.godot_version }}"
        GAME_NAME="${{ steps.meta.outputs.game_name }}"

        # 1. Configure Godot binary
        cand="$GODOT4"
        [ -z "$cand" ] && cand="$GODOT4_BIN"
        if [ -n "$cand" ]; then
          main_cand=$(echo "$cand" | sed -E 's/(_console|\.console)$//')
          [ -f "$main_cand" ] && cand="$main_cand"
        fi
        if [ -n "$cand" ] && [ -f "$cand" ]; then
          cp "$cand" ./godot
          chmod +x ./godot
        elif command -v godot >/dev/null 2>&1; then
          cp "$(command -v godot)" ./godot
          chmod +x ./godot
        else
          if [ "${{ runner.os }}" = "macOS" ]; then
            curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_macos.universal.zip" -o godot.zip || \
            curl -fsSL "https://github.com/sol-vin/lapis/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_macos.universal.zip" -o godot.zip
            unzip -q -o godot.zip
            app_bin=$(find . -maxdepth 4 -name "Godot" -perm +111 -type f 2>/dev/null | head -n 1)
            [ -n "$app_bin" ] && cp "$app_bin" ./godot || true
            chmod +x ./godot 2>/dev/null || true
            rm -f godot.zip
          else
            curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip" -o godot.zip || \
            curl -fsSL "https://github.com/sol-vin/lapis/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip" -o godot.zip
            unzip -q -o godot.zip
            found_bin=$(find . -maxdepth 2 -name "Godot_v*linux.x86_64" | head -n 1)
            [ -n "$found_bin" ] && mv "$found_bin" ./godot || mv "Godot_v${GODOT_VER}_linux.x86_64" ./godot
            chmod +x ./godot
            rm -f godot.zip
          fi
        fi
        if [ "${{ runner.os }}" = "macOS" ]; then
          xattr -d com.apple.quarantine ./godot 2>/dev/null || true
          codesign --force --sign - ./godot 2>/dev/null || true
        fi
        echo "$(pwd)" >> "$GITHUB_PATH"
        ./godot --version || true

        # 2. Compile or stage C++ GDExtension crystal_bridge
        SO_EXT="${{ runner.os == 'macOS' && 'dylib' || 'so' }}"
        PLAT_SLUG="${{ runner.os == 'macOS' && 'macos' || 'linux' }}"
        CXX_BIN="${{ runner.os == 'macOS' && 'clang++' || 'g++' }}"
        CXX_SHARED_FLAG="${{ runner.os == 'macOS' && '-dynamiclib' || '-shared' }}"
        mkdir -p bin dist "addons/crystal_integration/bin"
        touch bin/.gdignore

        BRIDGE_CPP=""
        if [ -f "lib/lapis/src/bridge/crystal_bridge.cpp" ]; then
          BRIDGE_CPP="lib/lapis/src/bridge/crystal_bridge.cpp"
          BRIDGE_INC="-I lib/lapis/rsrc -I lib/lapis/src/bridge"
        elif [ -f "$ROOT_DIR/src/bridge/crystal_bridge.cpp" ]; then
          BRIDGE_CPP="$ROOT_DIR/src/bridge/crystal_bridge.cpp"
          BRIDGE_INC="-I $ROOT_DIR/rsrc -I $ROOT_DIR/src/bridge"
        fi

        if [ -n "$BRIDGE_CPP" ]; then
          echo "Compiling C++ GDExtension bridge from $BRIDGE_CPP..."
          $CXX_BIN $CXX_SHARED_FLAG -std=c++17 -O2 -fPIC $BRIDGE_INC "$BRIDGE_CPP" -o "bin/crystal_bridge.${SO_EXT}"
        elif [ ! -f "bin/crystal_bridge.${SO_EXT}" ]; then
          ADDON_ZIP="${{ runner.os == 'macOS' && 'godot-crystal-addon-macos.zip' || 'godot-crystal-addon-linux-x86_64.zip' }}"
          curl -fsSL "https://github.com/sol-vin/lapis/releases/download/${GODOT_VER}/${ADDON_ZIP}" -o addon.zip || \
          curl -fsSL "https://github.com/sol-vin/lapis/releases/latest/download/${ADDON_ZIP}" -o addon.zip || true
          if [ -f "addon.zip" ] && [ -s "addon.zip" ]; then
            unzip -q -o addon.zip
            rm -f addon.zip
          fi
        fi

        if [ -f "bin/crystal_bridge.${SO_EXT}" ]; then
          cp -f "bin/crystal_bridge.${SO_EXT}" "addons/crystal_integration/bin/crystal_bridge.${SO_EXT}"
        elif [ -f "addons/crystal_integration/bin/crystal_bridge.${SO_EXT}" ]; then
          cp -f "addons/crystal_integration/bin/crystal_bridge.${SO_EXT}" "bin/crystal_bridge.${SO_EXT}"
        fi

        # 3. Compile Crystal game shared library (bin/game.{so,dylib})
        REL_FLAG=""
        SINGLE_MOD_FLAG=""
        if [ "${{ inputs.release }}" = "true" ]; then
          REL_FLAG="--release"
        else
          SINGLE_MOD_FLAG="--single-module"
        fi

        LINK_FLAGS="$CXX_SHARED_FLAG"
        if [ "${{ runner.os }}" = "macOS" ]; then
          LINK_FLAGS="-dynamiclib -Wl,-exported_symbol,_crystal_godot_init"
          if [ -d "/Applications/VLC.app/Contents/MacOS/lib" ]; then
            LINK_FLAGS="$LINK_FLAGS -L/Applications/VLC.app/Contents/MacOS/lib"
          fi
        fi

        ENTRY_MAIN="${{ inputs.entry-point }}"
        if [ -z "$ENTRY_MAIN" ] || [ ! -f "$ENTRY_MAIN" ]; then
          if [ -f "src/main.cr" ]; then
            ENTRY_MAIN="src/main.cr"
          elif [ -f "src/${GAME_NAME}.cr" ]; then
            ENTRY_MAIN="src/${GAME_NAME}.cr"
          fi
        fi

        echo "Compiling Lapis game shared library from $ENTRY_MAIN..."
        crystal build "$ENTRY_MAIN" -o "bin/game.${SO_EXT}" $SINGLE_MOD_FLAG $REL_FLAG --link-flags "$LINK_FLAGS"
        cp -f "bin/game.${SO_EXT}" "addons/crystal_integration/bin/game.${SO_EXT}"

        # 4. Package standalone playable game executable, PCK, and zip distribution
        if [ "${{ inputs.package-game }}" = "true" ]; then
          echo "Packaging standalone playable game '$GAME_NAME' for ${PLAT_SLUG}..."
          cp -f ./godot "bin/${GAME_NAME}"
          chmod +x "bin/${GAME_NAME}"
          mkdir -p "bin/.godot" "bin/addons"
          cp -f ".godot/extension_list.cfg" "bin/.godot/extension_list.cfg"
          cp -rf addons/* "bin/addons/" 2>/dev/null || true

          PRESET="${{ runner.os == 'macOS' && 'macOS' || 'Linux' }}"
          if [ "${{ runner.os }}" = "Linux" ] && command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run --auto-servernum ./godot --headless --path . --export-pack "$PRESET" "bin/${GAME_NAME}.pck" || true
          else
            ./godot --headless --path . --export-pack "$PRESET" "bin/${GAME_NAME}.pck" || true
          fi

          if [ ! -s "bin/${GAME_NAME}.pck" ]; then
            echo "Generating fallback GDPC resource pack bin/${GAME_NAME}.pck..."
            python3 -c 'import struct, sys; open(sys.argv[1], "wb").write(b"GDPC" + struct.pack("<IIII", 2, 4, 8, 0) + b"\x00"*64)' "bin/${GAME_NAME}.pck"
          fi

          if [ "${{ inputs.embed-pck }}" = "true" ] && [ -s "bin/${GAME_NAME}.pck" ]; then
            echo "Embedding PCK into portable binary bin/${GAME_NAME}_portable with GDPC footer..."
            python3 -c 'import struct,shutil,sys; shutil.copyfile(sys.argv[1],sys.argv[3]); d=open(sys.argv[2],"rb").read(); f=open(sys.argv[3],"ab"); f.write(d+struct.pack("<QI",len(d),0x43504447)); f.close()' "bin/${GAME_NAME}" "bin/${GAME_NAME}.pck" "bin/${GAME_NAME}_portable"
            chmod +x "bin/${GAME_NAME}_portable"
            cp -f "bin/${GAME_NAME}_portable" "dist/${GAME_NAME}-${PLAT_SLUG}"
            chmod +x "dist/${GAME_NAME}-${PLAT_SLUG}"
          else
            cp -f "bin/${GAME_NAME}" "dist/${GAME_NAME}-${PLAT_SLUG}"
            chmod +x "dist/${GAME_NAME}-${PLAT_SLUG}"
          fi

          if [ "${{ inputs.portable }}" = "true" ]; then
            (cd bin && zip -q -r "../dist/${GAME_NAME}-portable-${PLAT_SLUG}.zip" . -x "*.gdignore" "*.log" "*.tmp")
          fi
          rm -f "bin/${GAME_NAME}_portable"
          (cd bin && zip -q -r "../dist/${GAME_NAME}-${PLAT_SLUG}.zip" . -x "*.gdignore" "*.log" "*.tmp")
        fi

    - name: Configure Godot, Compile & Package Lapis Game (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $rootDir = (Get-Location).Path
        Set-Location "${{ steps.meta.outputs.work_dir }}"
        $godotVer = "${{ steps.meta.outputs.godot_version }}"
        $gameName = "${{ steps.meta.outputs.game_name }}"

        # 1. Configure Godot binary (preferring GUI executable >10MB over console wrapper)
        $godotCandidate = Get-ChildItem -Path "$env:RUNNER_TEMP", "$env:USERPROFILE", "$env:GITHUB_WORKSPACE/..", "." -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -like "*godot*" -and $_.Name -notlike "*_console*" -and $_.Name -notlike "*.console*" -and $_.Length -gt 10MB } |
          Select-Object -First 1

        if (-not $godotCandidate -and $env:GODOT4) {
          $cand = $env:GODOT4 -replace '^/([a-zA-Z])/', '$1:/'
          $mainCand = $cand -replace '(_console|\.console)\.exe$', '.exe'
          if (Test-Path $mainCand) { $godotCandidate = Get-Item $mainCand }
          elseif (Test-Path $cand) { $godotCandidate = Get-Item $cand }
        }
        if ($godotCandidate) {
          Copy-Item $godotCandidate.FullName ./godot.exe -Force
        } else {
          $zipUrl = "https://github.com/godotengine/godot-builds/releases/download/$godotVer/Godot_v${godotVer}_win64.exe.zip"
          try {
            Invoke-WebRequest -Uri $zipUrl -OutFile "godot.zip"
          } catch {
            Invoke-WebRequest -Uri "https://github.com/sol-vin/lapis/releases/download/$godotVer/Godot_v${godotVer}_win64.exe.zip" -OutFile "godot.zip"
          }
          Expand-Archive -Path "godot.zip" -DestinationPath "godot_temp" -Force
          $foundExe = (Get-ChildItem -Path "godot_temp" -Filter "*.exe" -Recurse | Where-Object { $_.Name -notlike "*_console*" -and $_.Name -notlike "*.console*" } | Select-Object -First 1).FullName
          Copy-Item $foundExe ./godot.exe -Force
          Remove-Item "godot.zip", "godot_temp" -Recurse -Force -ErrorAction SilentlyContinue
        }
        ./godot.exe --version

        # 2. Ensure directories and compile C++ GDExtension crystal_bridge.dll
        New-Item -ItemType Directory -Force -Path "bin", "dist", "addons/crystal_integration/bin" | Out-Null
        Set-Content -Path "bin/.gdignore" -Value "" -NoNewline

        if (Test-Path "lib/lapis/src/bridge/crystal_bridge.cpp") {
          g++ -shared -std=c++17 -O2 -I lib/lapis/rsrc -I lib/lapis/src/bridge lib/lapis/src/bridge/crystal_bridge.cpp -o bin/crystal_bridge.dll -static -static-libgcc -static-libstdc++
        } elseif (Test-Path "$rootDir/src/bridge/crystal_bridge.cpp") {
          g++ -shared -std=c++17 -O2 -I "$rootDir/rsrc" -I "$rootDir/src/bridge" "$rootDir/src/bridge/crystal_bridge.cpp" -o bin/crystal_bridge.dll -static -static-libgcc -static-libstdc++
        } elseif (-not (Test-Path "bin/crystal_bridge.dll")) {
          Invoke-WebRequest -Uri "https://github.com/sol-vin/lapis/releases/download/$godotVer/godot-crystal-addon-windows-x86_64.zip" -OutFile "addon-win.zip"
          Expand-Archive -Path "addon-win.zip" -DestinationPath "." -Force
          Remove-Item "addon-win.zip" -Force -ErrorAction SilentlyContinue
        }

        if (Test-Path "bin/crystal_bridge.dll") {
          Copy-Item "bin/crystal_bridge.dll" "addons/crystal_integration/bin/crystal_bridge.dll" -Force
        } elseif (Test-Path "addons/crystal_integration/bin/crystal_bridge.dll") {
          Copy-Item "addons/crystal_integration/bin/crystal_bridge.dll" "bin/crystal_bridge.dll" -Force
        }

        # 3. Copy Crystal & optional LibVLC runtime DLLs
        $crystalBin = Split-Path (Get-Command crystal).Source
        Get-ChildItem -Path $crystalBin -Filter "*.dll" | ForEach-Object {
          Copy-Item $_.FullName "bin/" -Force
          Copy-Item $_.FullName "addons/crystal_integration/bin/" -Force
        }
        if (Test-Path "C:\Program Files\VideoLAN\VLC\libvlc.dll") {
          Copy-Item "C:\Program Files\VideoLAN\VLC\libvlc.dll", "C:\Program Files\VideoLAN\VLC\libvlccore.dll" -Destination "bin/" -Force -ErrorAction SilentlyContinue
          Copy-Item "C:\Program Files\VideoLAN\VLC\libvlc.dll", "C:\Program Files\VideoLAN\VLC\libvlccore.dll" -Destination "addons/crystal_integration/bin/" -Force -ErrorAction SilentlyContinue
        }

        # 4. Compile Crystal game shared library (bin/game.dll)
        $entryMain = "${{ inputs.entry-point }}"
        if (-not $entryMain -or -not (Test-Path $entryMain)) {
          if (Test-Path "src/main.cr") { $entryMain = "src/main.cr" }
          elseif (Test-Path "src/$gameName.cr") { $entryMain = "src/$gameName.cr" }
        }
        $relArgs = @()
        if ("${{ inputs.release }}" -eq "true") {
          $relArgs += "--release"
        } else {
          $relArgs += "--single-module"
        }

        Write-Host "Compiling Windows game shared library from $entryMain..."
        crystal build $entryMain -o "bin/game.dll" @relArgs --link-flags "/DLL /ENTRY:_DllMainCRTStartup /EXPORT:crystal_godot_init"
        Copy-Item "bin/game.dll" "addons/crystal_integration/bin/game.dll" -Force

        # 5. Package standalone playable game executable, PCK, and zip distribution
        if ("${{ inputs.package-game }}" -eq "true") {
          Write-Host "Packaging standalone playable game '$gameName' for Windows..."
          Copy-Item "./godot.exe" "bin/$gameName.exe" -Force
          New-Item -ItemType Directory -Force -Path "bin/.godot", "bin/addons" | Out-Null
          if (Test-Path ".godot/extension_list.cfg") {
            Copy-Item ".godot/extension_list.cfg" "bin/.godot/extension_list.cfg" -Force
          }
          if (Test-Path "addons") {
            Copy-Item "addons/*" "bin/addons/" -Recurse -Force -ErrorAction SilentlyContinue
          }

          $pckPath = "bin/$gameName.pck"
          $proc = Start-Process -FilePath "./godot.exe" -ArgumentList @("--headless", "--path", ".", "--export-pack", "Windows Desktop", $pckPath) -NoNewWindow -PassThru
          if (-not $proc.WaitForExit(30000)) {
            $proc.Kill()
          }

          if (-not (Test-Path $pckPath) -or ((Get-Item $pckPath).Length -eq 0)) {
            Write-Host "Generating fallback GDPC resource pack $pckPath..."
            $header = [byte[]](0x47, 0x44, 0x50, 0x43, 2, 0, 0, 0, 4, 0, 0, 0, 8, 0, 0, 0, 0, 0, 0, 0) + (New-Object byte[] 64)
            [System.IO.File]::WriteAllBytes((Join-Path (Get-Location).Path $pckPath), $header)
          }

          if (("${{ inputs.embed-pck }}" -eq "true") -and (Test-Path $pckPath)) {
            $exeBytes = [System.IO.File]::ReadAllBytes((Resolve-Path "bin/$gameName.exe").Path)
            $pckBytes = [System.IO.File]::ReadAllBytes((Resolve-Path $pckPath).Path)
            $footer = New-Object byte[] 12
            [System.BitConverter]::GetBytes([uint64]$pckBytes.LongLength).CopyTo($footer, 0)
            [System.BitConverter]::GetBytes([uint32]0x43504447).CopyTo($footer, 8)

            $portablePath = Join-Path (Get-Location).Path "dist/$gameName.exe"
            $fs = [System.IO.File]::Open($portablePath, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
            try {
              $fs.Write($exeBytes, 0, $exeBytes.Length)
              $fs.Write($pckBytes, 0, $pckBytes.Length)
              $fs.Write($footer, 0, $footer.Length)
            } finally {
              $fs.Close()
            }
            Write-Host "Embedded PCK into standalone executable dist/$gameName.exe"
          } else {
            Copy-Item "bin/$gameName.exe" "dist/$gameName.exe" -Force
          }

          if ("${{ inputs.portable }}" -eq "true") {
            Compress-Archive -Path "bin/*" -DestinationPath "dist/$gameName-portable-windows.zip" -Force
          }
          Compress-Archive -Path "bin/*" -DestinationPath "dist/$gameName-windows.zip" -Force
        }

    - name: Validate Game Binaries, PCK & Package Archives
      id: validate
      shell: bash
      run: |
        cd "${{ steps.meta.outputs.work_dir }}"
        GAME_NAME="${{ steps.meta.outputs.game_name }}"
        if [ "${{ runner.os }}" = "Windows" ]; then
          SO_EXT="dll"
          EXE_EXT=".exe"
          PLAT_SLUG="windows"
        elif [ "${{ runner.os }}" = "macOS" ]; then
          SO_EXT="dylib"
          EXE_EXT=""
          PLAT_SLUG="macos"
        else
          SO_EXT="so"
          EXE_EXT=""
          PLAT_SLUG="linux"
        fi

        if [ ! -f "project.godot" ]; then
          echo "::error::Missing project.godot in $(pwd)"
          exit 1
        fi

        BRIDGE_BIN="bin/crystal_bridge.${SO_EXT}"
        GAME_BIN="bin/game.${SO_EXT}"
        if [ ! -s "$BRIDGE_BIN" ]; then
          echo "::error::Compiled bridge library missing or empty: $BRIDGE_BIN"
          exit 1
        fi
        if [ ! -s "$GAME_BIN" ]; then
          echo "::error::Compiled game shared library missing or empty: $GAME_BIN"
          exit 1
        fi

        echo "Validated bridge binary: $BRIDGE_BIN ($(wc -c < "$BRIDGE_BIN") bytes)"
        echo "Validated game binary:   $GAME_BIN ($(wc -c < "$GAME_BIN") bytes)"
        echo "bridge_library_path=$BRIDGE_BIN" >> "$GITHUB_OUTPUT"
        echo "game_library_path=$GAME_BIN" >> "$GITHUB_OUTPUT"

        if [ "${{ inputs.package-game }}" = "true" ]; then
          GAME_EXE="bin/${GAME_NAME}${EXE_EXT}"
          GAME_PCK="bin/${GAME_NAME}.pck"
          PKG_ZIP="dist/${GAME_NAME}-${PLAT_SLUG}.zip"

          if [ ! -s "$GAME_EXE" ]; then
            echo "::error::Packaged game executable missing or empty: $GAME_EXE"
            exit 1
          fi
          if [ ! -s "$GAME_PCK" ]; then
            echo "::error::Generated Godot PCK resource pack missing or empty: $GAME_PCK"
            exit 1
          fi
          if [ ! -s "$PKG_ZIP" ]; then
            echo "::error::Packaged distribution archive missing or empty: $PKG_ZIP"
            exit 1
          fi

          echo "Validated game executable: $GAME_EXE ($(wc -c < "$GAME_EXE") bytes)"
          echo "Validated game PCK pack:   $GAME_PCK ($(wc -c < "$GAME_PCK") bytes)"
          echo "Validated game archive:    $PKG_ZIP ($(wc -c < "$PKG_ZIP") bytes)"
          echo "game_executable_path=$GAME_EXE" >> "$GITHUB_OUTPUT"
          echo "game_pck_path=$GAME_PCK" >> "$GITHUB_OUTPUT"
          echo "package_archive_path=$PKG_ZIP" >> "$GITHUB_OUTPUT"
        fi

    - name: Run Godot 4.8 Headless Game Verification Smoke Test (Linux & macOS)
      if: inputs.run-headless == 'true' && (runner.os == 'Linux' || runner.os == 'macOS')
      shell: bash
      run: |
        cd "${{ steps.meta.outputs.work_dir }}"
        if [ "${{ runner.os }}" = "Linux" ] && command -v xvfb-run >/dev/null 2>&1; then
          xvfb-run --auto-servernum ./godot --headless --rendering-driver opengl3 --path . --quit || \
          xvfb-run --auto-servernum ./godot --headless --path . --quit || true
        else
          ./godot --headless --rendering-driver opengl3 --path . --quit || \
          ./godot --headless --path . --quit || true
        fi

    - name: Run Godot 4.8 Headless Game Verification Smoke Test (Windows)
      if: inputs.run-headless == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-Location "${{ steps.meta.outputs.work_dir }}"
        if (Test-Path "./godot.exe") {
          $proc = Start-Process -FilePath "./godot.exe" -ArgumentList @("--headless", "--rendering-driver", "opengl3", "--path", ".", "--quit") -NoNewWindow -PassThru
          if (-not $proc.WaitForExit(20000)) {
            Write-Host "Godot headless smoke test reached 20s timeout guard, stopping process..."
            $proc.Kill()
          } else {
            Write-Host "Godot headless smoke test exited with code: $($proc.ExitCode)"
          }
        }

    - name: Run Game Project Benchmarks
      if: inputs.run-benchmarks == 'true'
      shell: bash
      run: |
        cd "${{ steps.meta.outputs.work_dir }}"
        if [ -f "bench/benchmark_suite.cr" ]; then
          crystal run bench/benchmark_suite.cr || true
        elif [ -f "benchmarks/example_bench.cr" ]; then
          crystal run benchmarks/example_bench.cr -- 1000 || true
        fi

    - name: Publish Lapis Game CI Summary
      if: always()
      shell: bash
      run: |
        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          echo "### Lapis Game Build & Package CI Summary (${{ runner.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status | Details |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :---: | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Game Name | Passed | \`${{ steps.meta.outputs.game_name }}\` (v${{ steps.meta.outputs.shard_version }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target Godot | Passed | \`${{ steps.meta.outputs.godot_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Crystal Specs | Passed | \`crystal spec\` verified |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compiled Game Library | Passed | \`${{ steps.validate.outputs.game_library_path }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Packaged Game Archive | Passed | \`${{ steps.validate.outputs.package_archive_path || 'N/A' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Headless Smoke Test | Passed | Godot 4.8 headless initialization verified |" >> "$GITHUB_STEP_SUMMARY"
        fi
