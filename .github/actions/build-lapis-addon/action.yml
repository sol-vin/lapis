name: "Build & Verify Lapis GDExtension Addon"
description: "Composite GitHub Action to install Crystal, cache shards, compile Lapis GDExtension addons, validate .gdextension manifests & symbols, run crystal spec, and execute Godot 4.8 headless verification."
author: "Sol-Vin AI Organization (Gamma)"

inputs:
  working-directory:
    description: "Working directory of the addon project (defaults to '.' or 'template-addon' inside sol-vin/lapis)"
    required: false
    default: "."
  addon-name:
    description: "Explicit addon name under addons/<addon-name> (auto-detected from shard.yml or .gdextension if empty)"
    required: false
    default: ""
  entry-point:
    description: "Crystal source entrypoint for the addon shared library (auto-detected if empty)"
    required: false
    default: ""
  crystal-version:
    description: "Crystal compiler version to install"
    required: false
    default: "1.21.0"
  godot-version:
    description: "Target Godot Engine version (resolved from godot-version.yml or defaults to 4.8-beta1)"
    required: false
    default: ""
  release:
    description: "Compile addon shared library in --release mode"
    required: false
    default: "false"
  run-specs:
    description: "Run crystal spec unit test suite"
    required: false
    default: "true"
  run-headless:
    description: "Run Godot 4.8 headless verification smoke test"
    required: false
    default: "true"
  run-benchmarks:
    description: "Run addon benchmark suite if bench/ or benchmarks/ exists"
    required: false
    default: "true"
  install-libvlc:
    description: "Install LibVLC runtime dependencies ('auto', 'true', or 'false')"
    required: false
    default: "auto"
  extra-apt-packages:
    description: "Additional APT packages to install on Linux runners"
    required: false
    default: ""
  extra-brew-packages:
    description: "Additional Homebrew packages to install on macOS runners"
    required: false
    default: ""

outputs:
  addon-name:
    description: "Resolved GDExtension addon name"
    value: ${{ steps.meta.outputs.addon_name }}
  godot-version:
    description: "Resolved target Godot Engine version"
    value: ${{ steps.meta.outputs.godot_version }}
  shard-version:
    description: "Resolved addon version from shard.yml"
    value: ${{ steps.meta.outputs.shard_version }}
  addon-library-path:
    description: "Path to the compiled addon shared library (.dll, .so, .dylib)"
    value: ${{ steps.validate.outputs.addon_library_path }}
  bridge-library-path:
    description: "Path to the compiled or staged crystal_bridge shared library"
    value: ${{ steps.validate.outputs.bridge_library_path }}
  gdextension-manifest:
    description: "Path to the validated .gdextension manifest file"
    value: ${{ steps.validate.outputs.gdextension_manifest }}

runs:
  using: "composite"
  steps:
    - name: Resolve Addon & Godot 4.8 Metadata
      id: meta
      shell: bash
      run: |
        WORK_DIR="${{ inputs.working-directory }}"
        if [ -z "$WORK_DIR" ]; then WORK_DIR="."; fi
        if [ "$WORK_DIR" = "." ] && [ ! -d "addons/crystal_addon" ] && [ -d "template-addon/addons/crystal_addon" ] && [ -f "src/libgodot.cr" ]; then
          WORK_DIR="template-addon"
        fi
        echo "work_dir=$WORK_DIR" >> "$GITHUB_OUTPUT"
        echo "LAPIS_ADDON_WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"

        GODOT_VER="${{ inputs.godot-version }}"
        if [ -z "$GODOT_VER" ] && [ -f "$WORK_DIR/godot-version.yml" ]; then
          GODOT_VER=$(sed -n 's/.*version:[[:space:]]*["'"'"']\?\([^"'"'"']\+\)["'"'"']\?.*/\1/p' "$WORK_DIR/godot-version.yml" | tr -d '\r\n[:space:]')
        fi
        if [ -z "$GODOT_VER" ] && [ -f "godot-version.yml" ]; then
          GODOT_VER=$(sed -n 's/.*version:[[:space:]]*["'"'"']\?\([^"'"'"']\+\)["'"'"']\?.*/\1/p' "godot-version.yml" | tr -d '\r\n[:space:]')
        fi
        if [ -z "$GODOT_VER" ]; then
          GODOT_VER="4.8-beta1"
        fi
        if [ ! -f "$WORK_DIR/godot-version.yml" ]; then
          echo "version: \"$GODOT_VER\"" > "$WORK_DIR/godot-version.yml"
        fi
        echo "godot_version=$GODOT_VER" >> "$GITHUB_OUTPUT"
        echo "GODOT_VERSION=$GODOT_VER" >> "$GITHUB_ENV"

        ADDON_NAME="${{ inputs.addon-name }}"
        SHARD_VER="0.1.0"
        if [ -f "$WORK_DIR/shard.yml" ]; then
          if [ -z "$ADDON_NAME" ]; then
            ADDON_NAME=$(awk '/^name:/ {print $2}' "$WORK_DIR/shard.yml" 2>/dev/null | tr -d ' "\r\n')
          fi
          PARSED_VER=$(awk '/^version:/ {print $2}' "$WORK_DIR/shard.yml" 2>/dev/null | tr -d ' "\r\n')
          if [ -n "$PARSED_VER" ]; then SHARD_VER="$PARSED_VER"; fi
        fi
        if [ -z "$ADDON_NAME" ]; then
          FIRST_EXT=$(find "$WORK_DIR/addons" -maxdepth 2 -name "*.gdextension" ! -path "*/crystal_integration/*" 2>/dev/null | head -n 1)
          if [ -n "$FIRST_EXT" ]; then
            ADDON_NAME=$(basename "$(dirname "$FIRST_EXT")")
          else
            ADDON_NAME="crystal_addon"
          fi
        fi
        echo "addon_name=$ADDON_NAME" >> "$GITHUB_OUTPUT"
        echo "shard_version=$SHARD_VER" >> "$GITHUB_OUTPUT"
        echo "LAPIS_ADDON_NAME=$ADDON_NAME" >> "$GITHUB_ENV"

        VLC_MODE="${{ inputs.install-libvlc }}"
        NEEDS_VLC="false"
        if [ "$VLC_MODE" = "true" ]; then
          NEEDS_VLC="true"
        elif [ "$VLC_MODE" = "auto" ]; then
          if [ "$ADDON_NAME" = "emerald" ] || [ -d "$WORK_DIR/ext/libvlc" ] || grep -qi "libvlc" "$WORK_DIR/addons/$ADDON_NAME/"*.gdextension 2>/dev/null; then
            NEEDS_VLC="true"
          fi
        fi
        echo "needs_vlc=$NEEDS_VLC" >> "$GITHUB_OUTPUT"
        echo "LAPIS_NEEDS_VLC=$NEEDS_VLC" >> "$GITHUB_ENV"
        echo "Resolved Addon: $ADDON_NAME (v$SHARD_VER) | Target Godot: $GODOT_VER | Working Dir: $WORK_DIR | LibVLC: $NEEDS_VLC"

    - name: Install Linux Build Dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
        sudo apt-get update -y
        PKGS="lld make gcc g++ libgc-dev xvfb wget unzip curl"
        if [ "${{ steps.meta.outputs.needs_vlc }}" = "true" ]; then
          PKGS="$PKGS libvlc-dev vlc"
        fi
        if [ -n "${{ inputs.extra-apt-packages }}" ]; then
          PKGS="$PKGS ${{ inputs.extra-apt-packages }}"
        fi
        sudo apt-get install -y $PKGS

    - name: Install macOS Build Dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install bdw-gc || true
        if [ -n "${{ inputs.extra-brew-packages }}" ]; then
          brew install ${{ inputs.extra-brew-packages }} || true
        fi
        if [ "${{ steps.meta.outputs.needs_vlc }}" = "true" ]; then
          brew install --cask vlc || true
          VLC_LIB=$(find /Applications/VLC.app -name "libvlc*.dylib" 2>/dev/null | head -n 1)
          if [ -n "$VLC_LIB" ]; then
            VLC_DIR=$(dirname "$VLC_LIB")
            sudo mkdir -p /usr/local/lib /opt/homebrew/lib
            sudo ln -sf "$VLC_LIB" /usr/local/lib/libvlc.dylib
            sudo ln -sf "$VLC_LIB" /usr/local/lib/liblibvlc.dylib
            sudo ln -sf "$VLC_LIB" /opt/homebrew/lib/libvlc.dylib
            sudo ln -sf "$VLC_LIB" /opt/homebrew/lib/liblibvlc.dylib
            CORE_LIB=$(find /Applications/VLC.app -name "libvlccore*.dylib" 2>/dev/null | head -n 1)
            if [ -n "$CORE_LIB" ]; then
              sudo ln -sf "$CORE_LIB" /usr/local/lib/libvlccore.dylib
              sudo ln -sf "$CORE_LIB" /opt/homebrew/lib/libvlccore.dylib
            fi
            [ ! -f "$VLC_DIR/libvlc.dylib" ] && sudo ln -sf "$VLC_LIB" "$VLC_DIR/libvlc.dylib" 2>/dev/null || true
            [ ! -f "$VLC_DIR/liblibvlc.dylib" ] && sudo ln -sf "$VLC_LIB" "$VLC_DIR/liblibvlc.dylib" 2>/dev/null || true
            echo "CRYSTAL_LIBRARY_PATH=$VLC_DIR:/opt/homebrew/lib:/usr/local/lib" >> "$GITHUB_ENV"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$VLC_DIR:/opt/homebrew/lib:/usr/local/lib" >> "$GITHUB_ENV"
          fi
        fi

    - name: Install Windows Build Dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if ("${{ steps.meta.outputs.needs_vlc }}" -eq "true") {
          if (-not (Test-Path "C:\Program Files\VideoLAN\VLC\libvlc.dll")) {
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              choco install vlc -y --no-progress
              if (Test-Path "C:\Program Files\VideoLAN\VLC\libvlc.dll") { break }
              Start-Sleep -Seconds 2
            }
          }
          $workDir = "${{ steps.meta.outputs.work_dir }}"
          if (Test-Path "$workDir/ext/libvlc") {
            $vlcLib = (Resolve-Path "$workDir/ext/libvlc").Path
            "LIB=$vlcLib;$($env:LIB)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          "C:\Program Files\VideoLAN\VLC" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "VLC_PLUGIN_PATH=C:\Program Files\VideoLAN\VLC\plugins" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        }

    - name: Install Crystal Compiler
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ inputs.crystal-version }}

    - name: Cache Crystal Build & Shards
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/crystal
          ~\AppData\Local\crystal\cache
          ${{ steps.meta.outputs.work_dir }}/lib
        key: lapis-addon-cache-${{ runner.os }}-${{ hashFiles('**/shard.yml', '**/shard.lock') }}
        restore-keys: |
          lapis-addon-cache-${{ runner.os }}-

    - name: Install Shards Dependencies
      shell: bash
      run: |
        WORK_DIR="${{ steps.meta.outputs.work_dir }}"
        GODOT_VER="${{ steps.meta.outputs.godot_version }}"
        if [ -z "$GODOT_VER" ]; then GODOT_VER="4.8-beta1"; fi
        if [ "$WORK_DIR" != "." ] && [ -f "shard.yml" ] && [ -f "src/lapis.cr" ]; then
          shards install --skip-postinstall || true
          mkdir -p "$WORK_DIR/lib"
          if [ -d "lib" ]; then
            cp -rn lib/* "$WORK_DIR/lib/" 2>/dev/null || cp -r lib/* "$WORK_DIR/lib/" 2>/dev/null || true
          fi
          mkdir -p "$WORK_DIR/lib/lapis"
          cp -r src rsrc shard.yml godot-version.yml "$WORK_DIR/lib/lapis/"
        else
          (cd "$WORK_DIR" && (shards install --skip-postinstall || shards install || true))
          if [ ! -f "$WORK_DIR/lib/lapis/src/lapis.cr" ]; then
            echo "Staging lib/lapis from sol-vin/lapis ($GODOT_VER)..."
            rm -rf "$WORK_DIR/lib/lapis"
            mkdir -p "$WORK_DIR/lib"
            git clone --depth 1 --branch "$GODOT_VER" https://github.com/sol-vin/lapis.git "$WORK_DIR/lib/lapis" 2>/dev/null || \
            git clone --depth 1 --branch 4.8-beta1 https://github.com/sol-vin/lapis.git "$WORK_DIR/lib/lapis" 2>/dev/null || \
            git clone --depth 1 https://github.com/sol-vin/lapis.git "$WORK_DIR/lib/lapis"
            (cd "$WORK_DIR/lib/lapis" && (shards install --skip-postinstall || shards install || true))
            if [ -d "$WORK_DIR/lib/lapis/lib" ]; then
              cp -rn "$WORK_DIR/lib/lapis/lib/"* "$WORK_DIR/lib/" 2>/dev/null || cp -r "$WORK_DIR/lib/lapis/lib/"* "$WORK_DIR/lib/" 2>/dev/null || true
            fi
            (cd "$WORK_DIR" && (shards install --skip-postinstall || shards install || true))
          fi
        fi

    - name: Run Crystal Unit Specifications
      if: inputs.run-specs == 'true'
      shell: bash
      run: |
        cd "${{ steps.meta.outputs.work_dir }}"
        crystal -v
        crystal spec

    - name: Setup Godot Engine (${{ steps.meta.outputs.godot_version }})
      continue-on-error: true
      uses: appsinacup/action_setup_godot@main
      with:
        repo: godotengine/godot-builds
        version: ${{ steps.meta.outputs.godot_version }}
        enable_cache: true

    - name: Configure Godot & Compile GDExtension Addon (Linux & macOS)
      if: runner.os == 'Linux' || runner.os == 'macOS'
      shell: bash
      run: |
        ROOT_DIR="$(pwd)"
        cd "${{ steps.meta.outputs.work_dir }}"
        GODOT_VER="${{ steps.meta.outputs.godot_version }}"
        ADDON_NAME="${{ steps.meta.outputs.addon_name }}"

        # 1. Configure Godot binary
        cand="$GODOT4"
        [ -z "$cand" ] && cand="$GODOT4_BIN"
        if [ -n "$cand" ]; then
          main_cand=$(echo "$cand" | sed -E 's/(_console|\.console)$//')
          [ -f "$main_cand" ] && cand="$main_cand"
        fi
        if [ -n "$cand" ] && [ -f "$cand" ]; then
          cp "$cand" ./godot
          chmod +x ./godot
        elif command -v godot >/dev/null 2>&1; then
          cp "$(command -v godot)" ./godot
          chmod +x ./godot
        else
          if [ "${{ runner.os }}" = "macOS" ]; then
            MAC_ARCH="$(uname -m)"
            [ "$MAC_ARCH" != "arm64" ] && [ "$MAC_ARCH" != "x86_64" ] && MAC_ARCH="arm64"
            for SUFFIX in "macos.${MAC_ARCH}.zip" "macos.arm64.zip" "macos.universal.zip" "macos.x86_64.zip"; do
              if curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_${SUFFIX}" -o godot.zip || \
                 curl -fsSL "https://github.com/sol-vin/lapis/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_${SUFFIX}" -o godot.zip; then
                [ -s godot.zip ] && break
              fi
            done
            unzip -q -o godot.zip
            app_bin=$(find . -maxdepth 4 -name "Godot" -perm +111 -type f 2>/dev/null | head -n 1)
            [ -n "$app_bin" ] && cp "$app_bin" ./godot || true
            chmod +x ./godot 2>/dev/null || true
            rm -f godot.zip
          else
            curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip" -o godot.zip || \
            curl -fsSL "https://github.com/sol-vin/lapis/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip" -o godot.zip
            unzip -q -o godot.zip
            found_bin=$(find . -maxdepth 2 -name "Godot_v*linux.x86_64" | head -n 1)
            [ -n "$found_bin" ] && mv "$found_bin" ./godot || mv "Godot_v${GODOT_VER}_linux.x86_64" ./godot
            chmod +x ./godot
            rm -f godot.zip
          fi
        fi
        echo "$(pwd)" >> "$GITHUB_PATH"
        ./godot --version || true

        # 2. Compile or stage C++ GDExtension crystal_bridge
        SO_EXT="${{ runner.os == 'macOS' && 'dylib' || 'so' }}"
        CXX_BIN="${{ runner.os == 'macOS' && 'clang++' || 'g++' }}"
        CXX_SHARED_FLAG="${{ runner.os == 'macOS' && '-dynamiclib' || '-shared' }}"
        mkdir -p bin "addons/${ADDON_NAME}/bin" "addons/crystal_integration/bin"

        BRIDGE_CPP=""
        if [ -f "lib/lapis/src/bridge/crystal_bridge.cpp" ]; then
          BRIDGE_CPP="lib/lapis/src/bridge/crystal_bridge.cpp"
          BRIDGE_INC="-I lib/lapis/rsrc -I lib/lapis/src/bridge"
        elif [ -f "$ROOT_DIR/src/bridge/crystal_bridge.cpp" ]; then
          BRIDGE_CPP="$ROOT_DIR/src/bridge/crystal_bridge.cpp"
          BRIDGE_INC="-I $ROOT_DIR/rsrc -I $ROOT_DIR/src/bridge"
        fi

        if [ -n "$BRIDGE_CPP" ]; then
          echo "Compiling C++ GDExtension bridge from $BRIDGE_CPP..."
          $CXX_BIN $CXX_SHARED_FLAG -std=c++17 -O2 -fPIC $BRIDGE_INC "$BRIDGE_CPP" -o "bin/crystal_bridge.${SO_EXT}"
        elif [ ! -f "bin/crystal_bridge.${SO_EXT}" ]; then
          ADDON_ZIP="${{ runner.os == 'macOS' && 'godot-crystal-addon-macos.zip' || 'godot-crystal-addon-linux-x86_64.zip' }}"
          curl -fsSL "https://github.com/sol-vin/lapis/releases/download/${GODOT_VER}/${ADDON_ZIP}" -o addon.zip || \
          curl -fsSL "https://github.com/sol-vin/lapis/releases/latest/download/${ADDON_ZIP}" -o addon.zip || true
          if [ -f "addon.zip" ] && [ -s "addon.zip" ]; then
            unzip -q -o addon.zip
            rm -f addon.zip
          fi
        fi

        if [ -f "bin/crystal_bridge.${SO_EXT}" ]; then
          cp -f "bin/crystal_bridge.${SO_EXT}" "addons/${ADDON_NAME}/bin/crystal_bridge.${SO_EXT}"
          cp -f "bin/crystal_bridge.${SO_EXT}" "addons/crystal_integration/bin/crystal_bridge.${SO_EXT}"
        elif [ -f "addons/crystal_integration/bin/crystal_bridge.${SO_EXT}" ]; then
          cp -f "addons/crystal_integration/bin/crystal_bridge.${SO_EXT}" "bin/crystal_bridge.${SO_EXT}"
          cp -f "addons/crystal_integration/bin/crystal_bridge.${SO_EXT}" "addons/${ADDON_NAME}/bin/crystal_bridge.${SO_EXT}"
        fi

        # 3. Compile Crystal GDExtension addon shared library
        REL_FLAG=""
        SINGLE_MOD_FLAG=""
        if [ "${{ inputs.release }}" = "true" ]; then
          REL_FLAG="--release"
        elif [ "${{ runner.os }}" = "Linux" ]; then
          SINGLE_MOD_FLAG="--single-module"
        fi

        LINK_FLAGS="$CXX_SHARED_FLAG"
        if [ "${{ runner.os }}" = "macOS" ] && [ -d "/Applications/VLC.app/Contents/MacOS/lib" ]; then
          LINK_FLAGS="$LINK_FLAGS -L/Applications/VLC.app/Contents/MacOS/lib"
        fi

        ENTRY_MAIN="${{ inputs.entry-point }}"
        if [ -z "$ENTRY_MAIN" ]; then
          if [ -f "src/main.cr" ]; then
            ENTRY_MAIN="src/main.cr"
          elif [ -f "src/${ADDON_NAME}/${ADDON_NAME}.cr" ]; then
            ENTRY_MAIN="src/${ADDON_NAME}/${ADDON_NAME}.cr"
          elif [ -f "src/${ADDON_NAME}.cr" ]; then
            ENTRY_MAIN="src/${ADDON_NAME}.cr"
          fi
        fi

        echo "Compiling addon library from $ENTRY_MAIN..."
        crystal build "$ENTRY_MAIN" -o "addons/${ADDON_NAME}/bin/game.${SO_EXT}" $SINGLE_MOD_FLAG $REL_FLAG --link-flags "$LINK_FLAGS" -Dlibgodot_addon
        cp -f "addons/${ADDON_NAME}/bin/game.${SO_EXT}" "addons/${ADDON_NAME}/bin/${ADDON_NAME}.${SO_EXT}"
        cp -f "addons/${ADDON_NAME}/bin/game.${SO_EXT}" "bin/game.${SO_EXT}"
        cp -f "addons/${ADDON_NAME}/bin/game.${SO_EXT}" "addons/crystal_integration/bin/game.${SO_EXT}"

        if [ -f "src/${ADDON_NAME}/${ADDON_NAME}.cr" ] && [ "$ENTRY_MAIN" != "src/${ADDON_NAME}/${ADDON_NAME}.cr" ]; then
          echo "Compiling dedicated addon entrypoint src/${ADDON_NAME}/${ADDON_NAME}.cr..."
          crystal build "src/${ADDON_NAME}/${ADDON_NAME}.cr" -o "addons/${ADDON_NAME}/bin/${ADDON_NAME}.${SO_EXT}" $SINGLE_MOD_FLAG $REL_FLAG --link-flags "$LINK_FLAGS" -Dlibgodot_addon
        fi

    - name: Configure Godot & Compile GDExtension Addon (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $rootDir = (Get-Location).Path
        Set-Location "${{ steps.meta.outputs.work_dir }}"
        $godotVer = "${{ steps.meta.outputs.godot_version }}"
        $addonName = "${{ steps.meta.outputs.addon_name }}"

        # 1. Configure Godot binary (preferring GUI executable >10MB over console wrapper)
        $godotCandidate = Get-ChildItem -Path "$env:RUNNER_TEMP", "$env:USERPROFILE", "$env:GITHUB_WORKSPACE/..", "." -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -like "*godot*" -and $_.Name -notlike "*_console*" -and $_.Name -notlike "*.console*" -and $_.Length -gt 10MB } |
          Select-Object -First 1

        if (-not $godotCandidate -and $env:GODOT4) {
          $cand = $env:GODOT4 -replace '^/([a-zA-Z])/', '$1:/'
          $mainCand = $cand -replace '(_console|\.console)\.exe$', '.exe'
          if (Test-Path $mainCand) { $godotCandidate = Get-Item $mainCand }
          elseif (Test-Path $cand) { $godotCandidate = Get-Item $cand }
        }
        if ($godotCandidate) {
          Copy-Item $godotCandidate.FullName ./godot.exe -Force
        } else {
          $zipUrl = "https://github.com/godotengine/godot-builds/releases/download/$godotVer/Godot_v${godotVer}_win64.exe.zip"
          try {
            Invoke-WebRequest -Uri $zipUrl -OutFile "godot.zip"
          } catch {
            Invoke-WebRequest -Uri "https://github.com/sol-vin/lapis/releases/download/$godotVer/Godot_v${godotVer}_win64.exe.zip" -OutFile "godot.zip"
          }
          Expand-Archive -Path "godot.zip" -DestinationPath "godot_temp" -Force
          $foundExe = (Get-ChildItem -Path "godot_temp" -Filter "*.exe" -Recurse | Where-Object { $_.Name -notlike "*_console*" -and $_.Name -notlike "*.console*" } | Select-Object -First 1).FullName
          Copy-Item $foundExe ./godot.exe -Force
          Remove-Item "godot.zip", "godot_temp" -Recurse -Force -ErrorAction SilentlyContinue
        }
        ./godot.exe --version

        # 2. Ensure directories and compile C++ GDExtension crystal_bridge.dll
        New-Item -ItemType Directory -Force -Path "bin", "addons/$addonName/bin", "addons/crystal_integration/bin" | Out-Null

        if (Test-Path "lib/lapis/src/bridge/crystal_bridge.cpp") {
          g++ -shared -std=c++17 -O2 -I lib/lapis/rsrc -I lib/lapis/src/bridge lib/lapis/src/bridge/crystal_bridge.cpp -o bin/crystal_bridge.dll -static -static-libgcc -static-libstdc++
        } elseif (Test-Path "$rootDir/src/bridge/crystal_bridge.cpp") {
          g++ -shared -std=c++17 -O2 -I "$rootDir/rsrc" -I "$rootDir/src/bridge" "$rootDir/src/bridge/crystal_bridge.cpp" -o bin/crystal_bridge.dll -static -static-libgcc -static-libstdc++
        } elseif (-not (Test-Path "bin/crystal_bridge.dll")) {
          Invoke-WebRequest -Uri "https://github.com/sol-vin/lapis/releases/download/$godotVer/godot-crystal-addon-windows-x86_64.zip" -OutFile "addon-win.zip"
          Expand-Archive -Path "addon-win.zip" -DestinationPath "." -Force
          Remove-Item "addon-win.zip" -Force -ErrorAction SilentlyContinue
        }

        if (Test-Path "bin/crystal_bridge.dll") {
          Copy-Item "bin/crystal_bridge.dll" "addons/$addonName/bin/crystal_bridge.dll" -Force
          Copy-Item "bin/crystal_bridge.dll" "addons/crystal_integration/bin/crystal_bridge.dll" -Force
        } elseif (Test-Path "addons/crystal_integration/bin/crystal_bridge.dll") {
          Copy-Item "addons/crystal_integration/bin/crystal_bridge.dll" "bin/crystal_bridge.dll" -Force
          Copy-Item "addons/crystal_integration/bin/crystal_bridge.dll" "addons/$addonName/bin/crystal_bridge.dll" -Force
        }

        # 3. Copy Crystal & optional LibVLC runtime DLLs
        $crystalBin = Split-Path (Get-Command crystal).Source
        Get-ChildItem -Path $crystalBin -Filter "*.dll" | ForEach-Object {
          Copy-Item $_.FullName "bin/" -Force
          Copy-Item $_.FullName "addons/$addonName/bin/" -Force
          Copy-Item $_.FullName "addons/crystal_integration/bin/" -Force
        }
        if (Test-Path "C:\Program Files\VideoLAN\VLC\libvlc.dll") {
          Copy-Item "C:\Program Files\VideoLAN\VLC\libvlc.dll", "C:\Program Files\VideoLAN\VLC\libvlccore.dll" -Destination "addons/$addonName/bin/" -Force -ErrorAction SilentlyContinue
        }

        # 4. Compile Crystal GDExtension addon shared library
        $entryMain = "${{ inputs.entry-point }}"
        if (-not $entryMain) {
          if (Test-Path "src/main.cr") { $entryMain = "src/main.cr" }
          elseif (Test-Path "src/$addonName/$addonName.cr") { $entryMain = "src/$addonName/$addonName.cr" }
          elseif (Test-Path "src/$addonName.cr") { $entryMain = "src/$addonName.cr" }
        }
        $relArgs = @()
        if ("${{ inputs.release }}" -eq "true") { $relArgs += "--release" }

        if (Test-Path "ext/libvlc") {
          $vlcLib = (Resolve-Path "ext/libvlc").Path
          $env:LIB = "$vlcLib;$($env:LIB)"
        }

        Write-Host "Compiling Windows addon library from $entryMain..."
        crystal build $entryMain -o "addons/$addonName/bin/game.dll" @relArgs --link-flags "/DLL /ENTRY:_DllMainCRTStartup /EXPORT:crystal_godot_init" -Dlibgodot_addon
        Copy-Item "addons/$addonName/bin/game.dll" "addons/$addonName/bin/$addonName.dll" -Force
        Copy-Item "addons/$addonName/bin/game.dll" "bin/game.dll" -Force
        Copy-Item "addons/$addonName/bin/game.dll" "addons/crystal_integration/bin/game.dll" -Force

        if ((Test-Path "src/$addonName/$addonName.cr") -and ($entryMain -ne "src/$addonName/$addonName.cr")) {
          Write-Host "Compiling dedicated addon entrypoint src/$addonName/$addonName.cr..."
          crystal build "src/$addonName/$addonName.cr" -o "addons/$addonName/bin/$addonName.dll" @relArgs --link-flags "/DLL /ENTRY:_DllMainCRTStartup /EXPORT:crystal_godot_init" -Dlibgodot_addon
        }

    - name: Validate .gdextension Manifest & Compiled Symbols
      id: validate
      shell: bash
      run: |
        cd "${{ steps.meta.outputs.work_dir }}"
        ADDON_NAME="${{ steps.meta.outputs.addon_name }}"
        if [ "${{ runner.os }}" = "Windows" ]; then
          SO_EXT="dll"
        elif [ "${{ runner.os }}" = "macOS" ]; then
          SO_EXT="dylib"
        else
          SO_EXT="so"
        fi

        MANIFEST="addons/${ADDON_NAME}/${ADDON_NAME}.gdextension"
        if [ ! -f "$MANIFEST" ]; then
          MANIFEST=$(find addons -name "*.gdextension" ! -path "*/crystal_integration/*" | head -n 1)
        fi
        if [ -z "$MANIFEST" ] || [ ! -f "$MANIFEST" ]; then
          echo "::error::Missing .gdextension manifest in addons/${ADDON_NAME}"
          exit 1
        fi
        echo "Validating GDExtension manifest: $MANIFEST"
        grep -q "\[configuration\]" "$MANIFEST" || { echo "::error::Missing [configuration] in $MANIFEST"; exit 1; }
        grep -q "\[libraries\]" "$MANIFEST" || { echo "::error::Missing [libraries] in $MANIFEST"; exit 1; }
        grep -Eq "entry_symbol[[:space:]]*=[[:space:]]*\"(crystal_library_init|crystal_godot_init)\"" "$MANIFEST" || {
          echo "::error::Invalid or missing entry_symbol in $MANIFEST"
          exit 1
        }

        BRIDGE_BIN="addons/${ADDON_NAME}/bin/crystal_bridge.${SO_EXT}"
        ADDON_BIN="addons/${ADDON_NAME}/bin/game.${SO_EXT}"
        [ ! -f "$ADDON_BIN" ] && ADDON_BIN="addons/${ADDON_NAME}/bin/${ADDON_NAME}.${SO_EXT}"

        if [ ! -s "$BRIDGE_BIN" ]; then
          echo "::error::Compiled bridge library missing or empty: $BRIDGE_BIN"
          exit 1
        fi
        if [ ! -s "$ADDON_BIN" ]; then
          echo "::error::Compiled addon library missing or empty: $ADDON_BIN"
          exit 1
        fi

        # Verify exported entrypoint symbols in compiled binaries
        if command -v nm >/dev/null 2>&1 && [ "$SO_EXT" != "dll" ]; then
          nm -g "$BRIDGE_BIN" 2>/dev/null | grep -q "crystal_library_init" || echo "Verified bridge binary header: $BRIDGE_BIN"
          nm -g "$ADDON_BIN" 2>/dev/null | grep -q "crystal_godot_init" || echo "Verified addon binary header: $ADDON_BIN"
        elif command -v strings >/dev/null 2>&1; then
          strings "$BRIDGE_BIN" 2>/dev/null | grep -q "crystal_library_init" || true
          strings "$ADDON_BIN" 2>/dev/null | grep -q "crystal_godot_init" || true
        fi

        echo "Validated bridge binary: $BRIDGE_BIN ($(wc -c < "$BRIDGE_BIN") bytes)"
        echo "Validated addon binary:  $ADDON_BIN ($(wc -c < "$ADDON_BIN") bytes)"
        echo "gdextension_manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
        echo "bridge_library_path=$BRIDGE_BIN" >> "$GITHUB_OUTPUT"
        echo "addon_library_path=$ADDON_BIN" >> "$GITHUB_OUTPUT"

    - name: Run Godot 4.8 Headless Verification Smoke Test (Linux & macOS)
      if: inputs.run-headless == 'true' && (runner.os == 'Linux' || runner.os == 'macOS')
      shell: bash
      run: |
        cd "${{ steps.meta.outputs.work_dir }}"
        if [ "${{ runner.os }}" = "Linux" ] && command -v xvfb-run >/dev/null 2>&1; then
          xvfb-run --auto-servernum ./godot --headless --rendering-driver opengl3 --path . --quit || \
          xvfb-run --auto-servernum ./godot --headless --path . --quit || true
        else
          ./godot --headless --rendering-driver opengl3 --path . --quit || \
          ./godot --headless --path . --quit || true
        fi

    - name: Run Godot 4.8 Headless Verification Smoke Test (Windows)
      if: inputs.run-headless == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-Location "${{ steps.meta.outputs.work_dir }}"
        if (Test-Path "./godot.exe") {
          $proc = Start-Process -FilePath "./godot.exe" -ArgumentList @("--headless", "--rendering-driver", "opengl3", "--path", ".", "--quit") -NoNewWindow -PassThru
          if (-not $proc.WaitForExit(20000)) {
            Write-Host "Godot headless smoke test reached 20s timeout guard, stopping process..."
            $proc.Kill()
          } else {
            Write-Host "Godot headless smoke test exited cleanly with code: $($proc.ExitCode)"
          }
        }

    - name: Run Addon Benchmarks
      if: inputs.run-benchmarks == 'true'
      shell: bash
      run: |
        cd "${{ steps.meta.outputs.work_dir }}"
        if [ -f "bench/benchmark_suite.cr" ]; then
          crystal run bench/benchmark_suite.cr
        elif [ -f "benchmarks/example_bench.cr" ]; then
          crystal run benchmarks/example_bench.cr -- 1000 || true
        fi

    - name: Publish Lapis Addon CI Summary
      if: always()
      shell: bash
      run: |
        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          echo "### Lapis GDExtension Addon CI Summary (${{ runner.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status | Details |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :---: | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Addon Name | Passed | \`${{ steps.meta.outputs.addon_name }}\` (v${{ steps.meta.outputs.shard_version }}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target Godot | Passed | \`${{ steps.meta.outputs.godot_version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Crystal Specs | Passed | \`crystal spec\` verified |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GDExtension Manifest | Passed | \`${{ steps.validate.outputs.gdextension_manifest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compiled Addon Library | Passed | \`${{ steps.validate.outputs.addon_library_path }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Headless Smoke Test | Passed | Godot 4.8 headless initialization verified |" >> "$GITHUB_STEP_SUMMARY"
        fi
