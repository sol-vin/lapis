  build-consumers-linux:
    name: Build Consumers & Templates (Linux)
    needs: [build-core-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LIBGODOT_VERBOSE: 1
      GODOT_VERBOSE: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Core Binaries
        uses: actions/download-artifact@v4
        with:
          name: core-binaries-linux

      - name: Fix Binary Permissions
        run: |
          mkdir -p bin
          for f in lapis game *.so; do
            if [ -f "$f" ] && [ ! -f "bin/$f" ]; then mv "$f" bin/; fi
          done
          chmod +x bin/lapis bin/*.so bin/game 2>/dev/null || true
          ls -la bin/

      - name: Resolve Godot Version
        id: godot-version
        shell: bash
        run: |
          GODOT_VER=$(sed -n 's/.*version:[[:space:]]*["'"'"']\?\([^"'"'"']\+\)["'"'"']\?.*/\1/p' godot-version.yml | tr -d '\r\n[:space:]')
          if [ -z "$GODOT_VER" ]; then GODOT_VER="4.8-dev6"; fi
          echo "version=$GODOT_VER" >> "$GITHUB_OUTPUT"
          echo "GODOT_VERSION=$GODOT_VER" >> "$GITHUB_ENV"

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Cache Crystal Build Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/crystal
          key: crystal-cache-linux-${{ runner.os }}-${{ hashFiles('shard.yml', 'shard.lock') }}
          restore-keys: |
            crystal-cache-linux-${{ runner.os }}-

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lld lldb libgc-dev xvfb

      - name: Setup Godot Engine
        uses: appsinacup/action_setup_godot@main
        with:
          repo: godotengine/godot-builds
          version: ${{ env.GODOT_VERSION }}
          enable_cache: false

      - name: Configure Godot Executable
        shell: bash
        run: |
          if [ -n "$GODOT4" ] && [ -f "$GODOT4" ]; then
            cp "$GODOT4" ./godot
          elif [ -n "$GODOT4_BIN" ] && [ -f "$GODOT4_BIN" ]; then
            cp "$GODOT4_BIN" ./godot
          elif command -v godot >/dev/null 2>&1; then
            cp "$(command -v godot)" ./godot
          else
            wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O godot.zip
            unzip -q godot.zip
            found_bin=$(find . -maxdepth 2 -name "Godot_v*linux.x86_64" | head -n 1)
            mv "$found_bin" ./godot
            rm -f godot.zip
          fi
          chmod +x ./godot

      - name: Cache Godot Export Templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-export-templates-${{ env.GODOT_VERSION }}-linux
          restore-keys: |
            godot-export-templates-${{ env.GODOT_VERSION }}-

      - name: Ensure Godot Export Templates
        run: |
          bin/lapis setup templates

      - name: Build Templates, Examples & Benchmarks
        timeout-minutes: 10
        shell: bash
        run: |
          xvfb-run --auto-servernum make template template_addon examples perf perf_standalone RELEASE=1

      - name: Package Standalone Test Suite (Linux)
        run: |
          bin/lapis package tests -p linux -o bin/test-suite-linux.zip

      - name: Upload Consumer Packages Artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: consumer-packages-linux
          path: |
            template/bin/game.so
            examples/basic_demo/bin/game.so
            bin/test-suite-linux.zip
            template/dist/*.zip
            template-addon/dist/*.zip
          if-no-files-found: ignore

