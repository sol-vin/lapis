name: Reusable Lapis Game CI & Packaging

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Working directory of the Lapis game project (defaults to '.' or 'template' inside sol-vin/lapis)"
        required: false
        type: string
        default: "."
      game-name:
        description: "Explicit game binary and package name (auto-detected from shard.yml or project.godot if empty)"
        required: false
        type: string
        default: ""
      entry-point:
        description: "Crystal source entrypoint for the game shared library"
        required: false
        type: string
        default: "src/main.cr"
      crystal-version:
        description: "Crystal compiler version to install"
        required: false
        type: string
        default: "1.21.0"
      godot-version:
        description: "Target Godot Engine version (resolved from godot-version.yml or defaults to 4.8-dev7)"
        required: false
        type: string
        default: ""
      lapis-ref:
        description: "Git branch or ref of sol-vin/lapis to stage composite actions from"
        required: false
        type: string
        default: "4.8-dev7"
      os-matrix:
        description: "JSON array of runner OS images"
        required: false
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      release:
        description: "Compile game shared library and package in --release mode"
        required: false
        type: boolean
        default: false
      package-game:
        description: "Package standalone playable game executable, .pck resource pack, and distribution .zip archive"
        required: false
        type: boolean
        default: true
      embed-pck:
        description: "Embed Godot .pck resource pack into standalone game executable using GDPC footer"
        required: false
        type: boolean
        default: true
      portable:
        description: "Generate additional portable single-directory game .zip archive"
        required: false
        type: boolean
        default: false
      run-specs:
        description: "Run crystal spec unit test suite"
        required: false
        type: boolean
        default: true
      run-headless:
        description: "Run Godot 4.8 headless scene/script verification smoke test"
        required: false
        type: boolean
        default: true
      run-benchmarks:
        description: "Run game project benchmark suite if benchmarks/ or bench/ exists"
        required: false
        type: boolean
        default: true
      install-libvlc:
        description: "Install LibVLC runtime dependencies ('auto', 'true', or 'false')"
        required: false
        type: string
        default: "auto"
      extra-apt-packages:
        description: "Additional APT packages to install on Linux runners"
        required: false
        type: string
        default: ""
      extra-brew-packages:
        description: "Additional Homebrew packages to install on macOS runners"
        required: false
        type: string
        default: ""

  pull_request:
    branches:
      - "4.8-dev7"
      - "[0-9]*.[0-9]*-*"
    paths:
      - ".github/actions/build-lapis-game/**"
      - ".github/actions/setup-lapis/**"
      - ".github/workflows/build-game.yml"
      - "template/**"
      - "tools/lapis/src/ci/**"
      - "tools/lapis/src/ci.cr"
      - "tools/lapis/spec/ci_game_workflow_spec.cr"

  workflow_dispatch:

concurrency:
  group: lapis-game-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game-ci:
    name: Lapis Game CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}

    steps:
      - name: Checkout Game Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage Lapis Composite Action (Downstream Consumer)
        id: stage-action
        if: hashFiles('.github/actions/build-lapis-game/action.yml') == ''
        shell: bash
        run: |
          LAPIS_REF="${{ inputs.lapis-ref || '4.8-dev7' }}"
          STAGE_TMP="$RUNNER_TEMP/lapis-ci-actions"
          rm -rf "$STAGE_TMP"
          echo "Staging build-lapis-game composite action from sol-vin/lapis (${LAPIS_REF})..."
          git clone --depth 1 --branch "$LAPIS_REF" https://github.com/sol-vin/lapis.git "$STAGE_TMP" 2>/dev/null || \
            git clone --depth 1 https://github.com/sol-vin/lapis.git "$STAGE_TMP"
          git -C "$STAGE_TMP" fetch origin "refs/heads/${LAPIS_REF}" 2>/dev/null && \
            git -C "$STAGE_TMP" checkout -f FETCH_HEAD 2>/dev/null || true
          mkdir -p .github/actions
          cp -r "$STAGE_TMP/.github/actions/build-lapis-game" .github/actions/build-lapis-game
          if [ -d "$STAGE_TMP/.github/actions/setup-lapis" ]; then
            cp -r "$STAGE_TMP/.github/actions/setup-lapis" .github/actions/setup-lapis
          fi
          echo "staged=true" >> "$GITHUB_OUTPUT"

      - name: Build & Package Lapis Game
        id: build-game
        uses: ./.github/actions/build-lapis-game
        with:
          working-directory: ${{ inputs.working-directory || '.' }}
          game-name: ${{ inputs.game-name || '' }}
          entry-point: ${{ inputs.entry-point || 'src/main.cr' }}
          crystal-version: ${{ inputs.crystal-version || '1.21.0' }}
          godot-version: ${{ inputs.godot-version || '' }}
          release: ${{ inputs.release && 'true' || 'false' }}
          package-game: ${{ (inputs.package-game == false) && 'false' || 'true' }}
          embed-pck: ${{ (inputs.embed-pck == false) && 'false' || 'true' }}
          portable: ${{ inputs.portable && 'true' || 'false' }}
          run-specs: ${{ (inputs.run-specs == false) && 'false' || 'true' }}
          run-headless: ${{ (inputs.run-headless == false) && 'false' || 'true' }}
          run-benchmarks: ${{ (inputs.run-benchmarks == false) && 'false' || 'true' }}
          install-libvlc: ${{ inputs.install-libvlc || 'auto' }}
          extra-apt-packages: ${{ inputs.extra-apt-packages || '' }}
          extra-brew-packages: ${{ inputs.extra-brew-packages || '' }}

      - name: Cleanup Staged Composite Action
        if: always() && steps.stage-action.outputs.staged == 'true'
        shell: bash
        run: |
          rm -rf .github/actions/build-lapis-game .github/actions/setup-lapis

  android-verify:
    name: Lapis Game Android Verification (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Game Repository
        uses: actions/checkout@v4

      - name: Audit Android Multiplatform Export Configuration
        shell: bash
        run: |
          WORK_DIR="${{ inputs.working-directory || '.' }}"
          if [ "$WORK_DIR" = "." ] && [ -f "src/libgodot.cr" ] && [ -d "template" ] && [ -f "template/project.godot" ]; then
            WORK_DIR="template"
          fi
          GODOT_VER="${{ inputs.godot-version }}"
          if [ -z "$GODOT_VER" ] && [ -f "$WORK_DIR/godot-version.yml" ]; then
            GODOT_VER=$(sed -n 's/.*version:[[:space:]]*["'"'"']\?\([^"'"'"']\+\)["'"'"']\?.*/\1/p' "$WORK_DIR/godot-version.yml" | tr -d '\r\n[:space:]')
          fi
          if [ -z "$GODOT_VER" ] && [ -f "godot-version.yml" ]; then
            GODOT_VER=$(sed -n 's/.*version:[[:space:]]*["'"'"']\?\([^"'"'"']\+\)["'"'"']\?.*/\1/p' "godot-version.yml" | tr -d '\r\n[:space:]')
          fi
          [ -z "$GODOT_VER" ] && GODOT_VER="4.8-dev7"

          cd "$WORK_DIR"
          if [ ! -f "project.godot" ]; then
            echo "::error::Missing project.godot in $WORK_DIR"
            exit 1
          fi
          if [ -f "export_presets.cfg" ]; then
            grep -q 'platform="Android"' export_presets.cfg || { echo "::error::Missing Android export preset in export_presets.cfg"; exit 1; }
          fi
          echo "Audited Lapis game project in $WORK_DIR for target Godot $GODOT_VER (arm64-v8a ready)"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### Android Game Multiplatform CI Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Check | Status | Details |" >> "$GITHUB_STEP_SUMMARY"
            echo "| :--- | :---: | :--- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Architecture | Passed | \`arm64-v8a\` ABI target verified |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Target Engine | Passed | \`$GODOT_VER\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Export Presets | Passed | \`export_presets.cfg\` validated |" >> "$GITHUB_STEP_SUMMARY"
          fi
