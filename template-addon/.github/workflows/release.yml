name: Release Addon

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0, or leave empty to auto-detect from shard.yml)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  init-release:
    name: Initialize Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_title: ${{ steps.meta.outputs.release_title }}
      godot_version: ${{ steps.meta.outputs.godot_version }}
      shard_version: ${{ steps.meta.outputs.shard_version }}
      addon_name: ${{ steps.meta.outputs.addon_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Release Metadata
        id: meta
        shell: bash
        run: |
          GODOT_VER=""
          if [ -f "godot-version.yml" ]; then
            GODOT_VER=$(sed -n 's/.*version:[[:space:]]*["'"'"']\?\([^"'"'"']\+\)["'"'"']\?.*/\1/p' godot-version.yml | tr -d '\r\n[:space:]')
          fi
          if [ -z "$GODOT_VER" ]; then GODOT_VER="4.8-dev6"; fi
          echo "godot_version=$GODOT_VER" >> "$GITHUB_OUTPUT"
          echo "Resolved Godot Version: $GODOT_VER"

          SHARD_VER=""
          ADDON_NAME=""
          if [ -f "shard.yml" ]; then
            SHARD_VER=$(sed -n 's/^version:[[:space:]]*["'"'"']\?\([^"'"'"']\+\)["'"'"']\?.*/\1/p' shard.yml | tr -d '\r\n[:space:]')
            ADDON_NAME=$(sed -n 's/^name:[[:space:]]*["'"'"']\?\([^"'"'"']\+\)["'"'"']\?.*/\1/p' shard.yml | tr -d '\r\n[:space:]')
          fi
          if [ -z "$SHARD_VER" ]; then SHARD_VER="0.1.0"; fi
          if [ -z "$ADDON_NAME" ]; then ADDON_NAME="crystal_addon"; fi

          echo "shard_version=$SHARD_VER" >> "$GITHUB_OUTPUT"
          echo "addon_name=$ADDON_NAME" >> "$GITHUB_OUTPUT"

          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            TITLE="Release $TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            TITLE="Release $TAG"
          else
            # Pushed to master or main: auto-detect version from shard.yml
            TAG="v$SHARD_VER"
            TITLE="Release $TAG"
          fi

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Release Tag: $TAG"
          echo "Release Title: $TITLE"

  fast-specs:
    name: Fast Specification Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y lld
          shards install || true
      - name: Run Specs
        run: |
          crystal spec

  build-release:
    name: Build & Package Addon (${{ matrix.platform }})
    needs: [init-release, fast-specs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Cache Crystal Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/crystal
            ~\AppData\Local\crystal\cache
          key: crystal-cache-${{ runner.os }}-${{ hashFiles('shard.yml', 'shard.lock') }}
          restore-keys: |
            crystal-cache-${{ runner.os }}-

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld make zip

      - name: Install Shards Dependencies
        run: |
          shards install || true

      - name: Setup Godot Engine
        uses: appsinacup/action_setup_godot@main
        with:
          repo: godotengine/godot-builds
          version: ${{ needs.init-release.outputs.godot_version }}
          enable_cache: true

      - name: Configure Godot Executable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          GODOT_VER="${{ needs.init-release.outputs.godot_version }}"
          if [ -n "$GODOT4" ] && [ -f "$GODOT4" ]; then
            cp "$GODOT4" ./godot
            chmod +x ./godot
          elif [ -n "$GODOT4_BIN" ] && [ -f "$GODOT4_BIN" ]; then
            cp "$GODOT4_BIN" ./godot
            chmod +x ./godot
          elif command -v godot >/dev/null 2>&1; then
            cp "$(command -v godot)" ./godot
            chmod +x ./godot
          else
            echo "Fallback: Downloading Godot ${GODOT_VER} linux.x86_64..."
            wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip" -O godot.zip
            unzip -q godot.zip
            found_bin=$(find . -maxdepth 2 -name "Godot_v*linux.x86_64" | head -n 1)
            [ -n "$found_bin" ] && mv "$found_bin" ./godot || mv "Godot_v${GODOT_VER}_linux.x86_64" ./godot
            chmod +x ./godot
            rm -f godot.zip
          fi
          echo "$(pwd)" >> "$GITHUB_PATH"
          ./godot --version || true

      - name: Configure Godot Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $godotVer = "${{ needs.init-release.outputs.godot_version }}"
          if (-not $godotVer) { $godotVer = "4.8-dev6" }
          $candidate = $env:GODOT4
          if ($candidate) { $candidate = $candidate -replace '^/([a-zA-Z])/', '$1:/' }
          if ($candidate) {
            $nonConsole = $candidate -replace '_console\.exe$', '.exe'
            if (Test-Path $nonConsole) {
              $candidate = $nonConsole
            }
          }
          if ($candidate -and (Test-Path $candidate)) {
            Copy-Item $candidate ./godot.exe -Force
          } else {
            $cmdCandidate = Get-Command godot.exe -ErrorAction SilentlyContinue
            if ($cmdCandidate) {
              Copy-Item $cmdCandidate.Source ./godot.exe -Force
            } else {
              Write-Host "Fallback: Downloading Godot $godotVer win64..."
              $zipUrl = "https://github.com/godotengine/godot-builds/releases/download/$godotVer/Godot_v${godotVer}_win64.exe.zip"
              Invoke-WebRequest -Uri $zipUrl -OutFile "godot.zip"
              Expand-Archive -Path "godot.zip" -DestinationPath "." -Force
              $extractedExe = Get-ChildItem -Path "." -Filter "Godot_v*_win64.exe" | Where-Object { $_.Name -notmatch "console" } | Select-Object -First 1
              if ($extractedExe) {
                Move-Item $extractedExe.FullName "./godot.exe" -Force
              }
              Remove-Item "godot.zip" -Force -ErrorAction SilentlyContinue
            }
          }
          ./godot.exe --version

      - name: Ensure Lapis CLI & Runtime Libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p bin
          if command -v lapis >/dev/null 2>&1; then
            echo "Lapis found on system PATH: $(command -v lapis)"
          elif [ -f "bin/lapis" ]; then
            echo "Lapis found in bin/lapis"
          elif [ -f "../bin/lapis" ]; then
            echo "Lapis found in parent directory"
            cp ../bin/lapis bin/
          else
            echo "Downloading pre-compiled Lapis CLI for Linux..."
            curl -sSL "https://github.com/sol-vin/lapis/releases/latest/download/lapis-linux-x86_64.tar.gz" -o lapis.tar.gz || wget -q "https://github.com/sol-vin/lapis/releases/latest/download/lapis-linux-x86_64.tar.gz" -O lapis.tar.gz
            if [ -f "lapis.tar.gz" ] && [ -s "lapis.tar.gz" ]; then
              tar -xzf lapis.tar.gz -C bin/
              rm -f lapis.tar.gz
              chmod +x bin/lapis 2>/dev/null || true
            fi
          fi
          if [ -f "bin/lapis" ]; then
            echo "$(pwd)/bin" >> "$GITHUB_PATH"
          fi
          if [ ! -f "bin/crystal_bridge.so" ] && [ ! -f "addons/*/*/crystal_bridge.so" ]; then
            echo "Staging pre-compiled Linux GDExtension bridge..."
            curl -sSL "https://github.com/sol-vin/lapis/releases/latest/download/godot-crystal-addon-linux-x86_64.zip" -o addon-linux.zip 2>/dev/null || true
            if [ -f "addon-linux.zip" ] && [ -s "addon-linux.zip" ]; then
              unzip -q -o addon-linux.zip
              rm -f addon-linux.zip
            fi
          fi

      - name: Ensure Lapis CLI & Runtime Libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin" | Out-Null
          if (Get-Command lapis.exe -ErrorAction SilentlyContinue) {
            Write-Host "Lapis found on system PATH"
          } elseif (Test-Path "bin/lapis.exe") {
            Write-Host "Lapis found in bin/"
          } elseif (Test-Path "../bin/lapis.exe") {
            Write-Host "Lapis found in parent directory"
            Copy-Item "../bin/lapis.exe" "bin/" -Force
          } else {
            Write-Host "Downloading pre-compiled Lapis CLI for Windows..."
            $lapisZip = "https://github.com/sol-vin/lapis/releases/latest/download/lapis-windows-x86_64.zip"
            try {
              Invoke-WebRequest -Uri $lapisZip -OutFile "lapis.zip"
              Expand-Archive -Path "lapis.zip" -DestinationPath "bin" -Force
              Remove-Item "lapis.zip" -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "Download skipped or failed: $_"
            }
          }
          if (Test-Path "bin/lapis.exe") {
            $binPath = (Get-Item "bin").FullName
            Add-Content -Path $env:GITHUB_PATH -Value $binPath
            ./bin/lapis.exe --version
          }

      - name: Build & Package Addon (Release Mode)
        run: |
          make package RELEASE=1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: addon-artifacts-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  finalize-release:
    name: Finalize & Publish Release
    needs: [init-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: addon-artifacts-*
          merge-multiple: true
          path: dist

      - name: Build Universal Addon Package & Checksums
        shell: bash
        run: |
          ADDON_NAME="${{ needs.init-release.outputs.addon_name }}"
          cd dist
          echo "Downloaded Artifacts:"
          ls -la

          # If both platform zips exist, merge them into universal <addon_name>.zip
          WIN_ZIP="${ADDON_NAME}-windows.zip"
          LINUX_ZIP="${ADDON_NAME}-linux.zip"
          if [ -f "$WIN_ZIP" ] && [ -f "$LINUX_ZIP" ]; then
            echo "Merging Windows and Linux libraries into universal ${ADDON_NAME}.zip..."
            STAGE_DIR="universal_stage"
            rm -rf "$STAGE_DIR"
            mkdir -p "$STAGE_DIR"
            unzip -q "$WIN_ZIP" -d "$STAGE_DIR"
            unzip -q -o "$LINUX_ZIP" -d "$STAGE_DIR"
            (cd "$STAGE_DIR" && zip -r "../${ADDON_NAME}.zip" ./*)
            rm -rf "$STAGE_DIR"
            echo "Created universal package: ${ADDON_NAME}.zip"
          fi

          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Generate Release Notes
        shell: bash
        run: |
          TAG="${{ needs.init-release.outputs.tag_name }}"
          ADDON_NAME="${{ needs.init-release.outputs.addon_name }}"
          GODOT_VER="${{ needs.init-release.outputs.godot_version }}"
          cat << 'EOF' > release_body.md
          ## Release Notes

          ### 🧩 Addon Packages
          - **`${ADDON_NAME}.zip`**: Universal redistributable GDExtension addon package containing pre-compiled binaries for **Windows (x86_64)** and **Linux (x86_64)**. Extract directly into your Godot project's root folder (`addons/${ADDON_NAME}/`).
          - **`${ADDON_NAME}-windows.zip`**: Windows (x86_64) specific package.
          - **`${ADDON_NAME}-linux.zip`**: Linux (x86_64) specific package.

          ### 🛠️ Quick Installation
          1. Download `${ADDON_NAME}.zip` (or your platform-specific zip).
          2. Extract the archive into your Godot project root.
          3. Open **Project Settings -> Plugins** in Godot and enable **${ADDON_NAME}**.

          ### 🎮 Engine Compatibility
          - Compatible with **Godot Engine v${GODOT_VER}** and newer.

          ### 🔒 Checksums (SHA-256)
          ```
          EOF
          cat dist/checksums.txt >> release_body.md
          cat << 'EOF' >> release_body.md
          ```
          EOF
          sed -i "s/\${TAG}/$TAG/g" release_body.md
          sed -i "s/\${ADDON_NAME}/$ADDON_NAME/g" release_body.md
          sed -i "s/\${GODOT_VER}/$GODOT_VER/g" release_body.md

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.init-release.outputs.tag_name }}
          name: ${{ needs.init-release.outputs.release_title }}
          body_path: release_body.md
          files: |
            dist/*
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Step Summary
        if: always()
        shell: bash
        run: |
          if [ -n "$GITHUB_STEP_SUMMARY" ] && [ -f "release_body.md" ]; then
            cat release_body.md >> "$GITHUB_STEP_SUMMARY"
          fi
