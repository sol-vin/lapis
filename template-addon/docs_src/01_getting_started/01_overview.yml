id: A_OVERVIEW
title: "Addon Architecture & Extension Lifecycle"
summary: "How your redistributable Godot GDExtension addon is structured, compiled, and loaded by Godot."
track: "01_getting_started"
root_module: "MyAddon::Docs"
overview: |
  Welcome to the Lapis Addon Template! This template provides a complete scaffold for authoring
  redistributable Godot GDExtension plugins in Crystal. Your compiled addon can be installed into
  any regular Godot project, providing custom nodes, editor tools, and gameplay systems without
  requiring consumers to have Crystal installed.
related_sources:
  - "src/main.cr"
  - "Makefile"
  - "addons/my_addon/my_addon.gdextension"
sections:
  - id: topic_01_addon_architecture
    title: "GDExtension Addon Architecture"
    summary: "How GDExtension loads your Crystal shared library via the C++ bridge."
    content: |
      The addon architecture consists of three core components:

      1. **GDExtension Manifest (`.gdextension`)**: Instructs Godot which shared library to load for each platform (Windows DLL, Linux SO, macOS dylib).
      2. **Loader Bridge (`crystal_bridge.dll`)**: Bootstraps the Boehm GC and dispatches native engine callbacks into Crystal.
      3. **Compiled Addon Library (`game.dll`)**: Contains your registered Crystal nodes and `EditorPlugin` implementations.
    examples:
      - |
        ```
        Godot Engine --> GDExtension Loader --> crystal_bridge.dll --> GC_init()
                                                                            |
                                                                            v
                                                                     game.dll (Crystal Addon)
                                                                            |
                                                                            v
                                                                 ClassDB Registration
                                                                (CrystalAddonBanner, etc.)
        ```

  - id: topic_02_plugin_lifecycle
    title: "EditorPlugin Lifecycle"
    summary: "Handling _enter_tree and _exit_tree in tool scripts."
    content: |
      An `EditorPlugin` runs directly inside the Godot Editor:

      ```crystal
      @[Tool]
      node CrystalAddonPlugin < EditorPlugin do
        def _enter_tree : Void
          Godot.print("[MyAddon] Plugin activated in Godot Editor!")
        end

        def _exit_tree : Void
          Godot.print("[MyAddon] Plugin deactivated in Godot Editor.")
        end
      end
      ```
