title: "Godot ObjectDB & Monotonic Instance IDs"
summary: "Mapping native C++ heap pointers to 64-bit monotonic instance IDs to prevent pointer reuse."
overview: |
  Technical analysis of Godot's ObjectDB internal architecture, monotonic 64-bit instance IDs,
  and how Lapis prevents heap address aliasing across recycled C++ allocations.
related_sources:
  - "**Object Implementation**: `src/libgodot/object.cr`"
  - "**Bridge Safety**: `src/bridge/crystal_bridge.cpp`"

sections:
  - id: "topic_00_core_concepts"
