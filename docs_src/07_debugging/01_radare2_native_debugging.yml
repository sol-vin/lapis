id: "A_RADARE2_NATIVE_DEBUGGING"
parent_module: "Lapis::Docs::G_DEBUGGING_AND_DIAGNOSTICS"
title: "Native radare2 Debugging, Decompilation & Gutter Breakpoints"
summary: "Attaching radare2 to Godot processes, native pseudo-C decompilation (pdc), disassembly, and multiplayer lockstep."
overview: |
  Comprehensive guide to debugging Crystal game code running inside Godot using the radare2
  native debugger and cradare2 engine, setting line-level breakpoints, decompiling functions on the fly,
  and coordinating multiplayer sessions in lockstep.
