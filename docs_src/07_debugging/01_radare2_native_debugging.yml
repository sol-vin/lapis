  - id: "topic_01_launching_under_radare2"
    title: "Launching Game or Editor under radare2"
    summary: "Running lapis run -d or lapis editor -d from command line or IDE."
    content: |
      #### Method 1: Command Line (Lapis CLI)
      ```bash
      # Run standalone game under radare2:
      lapis run --debug

      # Launch Godot Editor under radare2:
      lapis editor --debug

      # Decompile functions or classes into pseudo-C:
      lapis decompile bin/game.dll "Player#_physics_process"
      ```

      #### Method 2: Godot In-Editor Debugger
      1. Launch Godot Editor (`lapis editor`).
      2. The **Crystal (radare2)** panel appears automatically in the bottom debugger dock.
      3. Set breakpoints in the Godot Script Editor gutter.
      4. Press **F5** to run the project. When a breakpoint is hit, the 3-pane debugger interface displays call stacks, registers, and real-time decompiled pseudo-C!
