  - id: "topic_01_hardware_watchpoints"
    title: "Catching Illegal Writes with Hardware Watchpoints in radare2"
    summary: "Breaking execution at the exact CPU instruction performing memory corruption."
    content: |
      If a pointer or variable address is being corrupted mysteriously across frames:

      1. In radare2, find the address of the target variable or memory location:
         ```text
         [0x...]> ?v &my_variable
         0x0000021b3759c2f0
         ```
      2. Set a hardware write watchpoint on that memory location:
         ```text
         [0x...]> rw 0x0000021b3759c2f0
         ```
      3. Continue execution (`dc`).
      4. As soon as any thread or machine instruction writes to that address, the CPU traps immediately and radare2 pauses at the exact offending machine instruction!
