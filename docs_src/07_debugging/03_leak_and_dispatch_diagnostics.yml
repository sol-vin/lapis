id: "C_LEAK_AND_DISPATCH_DIAGNOSTICS"
parent_module: "Lapis::Docs::G_DEBUGGING_AND_DIAGNOSTICS"
title: "Leak Tracking & Latency Profiling"
summary: "Using LeakTracker, TombstoneTracker, and DispatchProfiler for runtime introspection."
overview: |
  Comprehensive guide to Lapis's built-in low-overhead diagnostic apparatus for catching memory leaks,
  measuring virtual method execution latency, tracking signal cascades, and debugging dead-pointer crashes.
related_sources:
  - "**Diagnostics Implementation**: `src/libgodot/diagnostics.cr`"
  - "**Object Safety Binding**: `src/libgodot/object.cr`"
  - "**Bridge Virtual Dispatch**: `src/libgodot/bridge.cr`"

sections:
  - id: "topic_00_diagnostic_modules"
    title: "Diagnostic Modules Overview"
    summary: "Listing of diagnostic tools available under Godot::Diagnostics."
    type: "Array(String)"
    return_value:
      - "Godot::Diagnostics::LeakTracker: Records allocations and dumps uncollected objects"
      - "Godot::Diagnostics::DispatchProfiler: Nanosecond timing of virtual method dispatches"
      - "Godot::Diagnostics::TombstoneTracker: Captures destruction callstacks to explain dead pointers"
      - "Godot::Diagnostics::SignalSpy: Real-time logging of scene tree signal emissions"

  - id: "topic_01_leak_tracker"
    title: "Godot::Diagnostics::LeakTracker"
    summary: "Detecting and identifying surviving Godot node and object leaks."
    content: |
      Compile with `-Dleak_tracker` or `lapis build --leak-tracker` to instrument `Godot::Object`:

      ```crystal
      require "libgodot"

      # Print number of currently active, tracked Godot objects:
      puts "Active objects: #{Godot::Diagnostics::LeakTracker.count}"

      # Dump all active objects along with their allocation callsite file and line:
      Godot::Diagnostics::LeakTracker.dump_active_objects
      ```

      Output format:
      ```text
      === Godot Active Object Allocations (2 active) ===
        #1536105194213 Enemy (src/gameplay/spawner.cr:28)
        #1536105194214 Bullet (src/weapons/blaster.cr:64)
      ==================================================
      ```

  - id: "topic_02_dispatch_profiler"
    title: "Godot::Diagnostics::DispatchProfiler"
    summary: "Measuring virtual method latency and execution bottlenecks."
    content: |
      Compile with `-Dprofile_dispatches` or `lapis build --profile-dispatches` to record timing metrics across virtual methods:

      ```crystal
      {% if flag?(:profile_dispatches) %}
        # Dump full dispatch table report to stdout:
        Godot::Diagnostics::DispatchProfiler.dump_report
      {% end %}
      ```

      Sample output:
      ```text
      === Virtual Method Dispatch Profiling Report ===
      Method               Calls       Total (ms)   Avg (ns)   Min (ns)   Max (ns)
      _process             12000       45.20 ms     3766 ns    2100 ns    14500 ns
      _physics_process     7200        22.10 ms     3069 ns    1950 ns    11200 ns
      _input               450         0.92 ms      2044 ns    1800 ns    5400 ns
      ================================================
      ```

  - id: "topic_03_tombstone_tracker"
    title: "Godot::Diagnostics::TombstoneTracker"
    summary: "Explaining dead-pointer crashes with destruction history."
    content: |
      When an object is freed by Godot or GDScript and subsequently dereferenced in Crystal, `Godot::DisposedObjectError` is raised.
      With `-Dtrace_dead_pointers` enabled, `TombstoneTracker` logs the destruction callstack:

      ```text
      Godot::DisposedObjectError: Attempted to access destroyed object #1536105194213 (Enemy)
      Object was previously destroyed at:
        src/combat/enemy.cr:42 in 'die'
        src/combat/battle.cr:115 in 'process_turn'
      ```

  - id: "topic_04_signal_spy"
    title: "Godot::Diagnostics::SignalSpy"
    summary: "Intercepting and tracing scene tree signal emissions."
    content: |
      When compiled with `-Dtrace_signals` or `lapis build --trace-signals`, every `emit_signal` call across the scene tree is intercepted and printed:

      ```text
      [SignalSpy] Player#1536105194213 emitted 'health_changed' with 2 args: [85, 100]
      [SignalSpy] Door#1536105194215 emitted 'opened' with 0 args: []
      ```
