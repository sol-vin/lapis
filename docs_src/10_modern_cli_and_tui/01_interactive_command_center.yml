id: "A_INTERACTIVE_COMMAND_CENTER"
parent_module: "Lapis::Docs::J_MODERN_CLI_AND_TUI"
title: "Interactive Terminal Command Center & Differential TUI"
summary: "High-density telemetry dashboard, split-pane layout, differential cell rendering, and keyboard shortcuts."
overview: |
  Comprehensive architectural and operational guide to Lapis's modern, double-buffered
  terminal user interface built with the Opal shard.
related_sources:
  - "**CLI Runner**: `tools/lapis/src/commands/test.cr`"
  - "**TUI Engine**: `tools/lapis/src/test_runner/tui.cr`"
  - "**Diff Renderer**: `tools/lapis/lib/opal/src/ui/diff_renderer.cr`"

sections:
  - id: "topic_00_command_center_overview"
    title: "Command Center Overview"
    summary: "High-density telemetry dashboard, split-pane viewport, and real-time execution metrics."
    content: |
      #### Features

      - Hero header displaying host OS, engine version, compiler version, active elapsed time, and heartbeat indicator.
      - Split-pane layout: Left pane displays phased execution checklist; right pane displays rolling live logs.
      - Real-time smooth progress bar with phase completion percentage and pass/fail counts.
      - Automatic non-TTY fallback for CI/CD pipelines, background daemons, or when invoked with `--no-tui`.

  - id: "topic_01_double_buffered_differential_rendering"
    title: "Differential Cell Rendering"
    summary: "Zero-flicker double-buffered ANSI rendering powered by Opal::UI::DiffRenderer."
    content: |
      #### Mechanics

      1. The TUI allocates a virtual screen buffer representing terminal grid cells `(char, style)`.
      2. Each update frame writes desired characters into the front buffer.
      3. `Opal::UI::DiffRenderer` compares front buffer cells against back buffer cells.
      4. Only modified cells emit ANSI cursor movement and color escape sequences to standard output.
      5. Completely eliminates screen tearing, flicker, and terminal lag during high-frequency log emission.

  - id: "topic_02_multi_view_tabs"
    title: "Multi-View Viewport Tabs"
    summary: "Tabbed navigation between Dashboard, Failures, Breakdown, and Live Telemetry."
    content: |
      <table>
        <thead>
          <tr>
            <th>Tab Key</th>
            <th>View Name</th>
            <th>Purpose</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><code>1</code></td>
            <td><strong>Dashboard</strong></td>
            <td>Primary split-pane view displaying checklist phases and rolling stdout.</td>
          </tr>
          <tr>
            <td><code>2</code></td>
