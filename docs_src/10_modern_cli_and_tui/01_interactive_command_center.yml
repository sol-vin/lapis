            <td>Navigate between test phases in checklist pane.</td>
          </tr>
          <tr>
            <td><code>PageUp</code> / <code>PageDown</code></td>
            <td>Scroll active logs viewport.</td>
          </tr>
          <tr>
            <td><code>f</code></td>
            <td>Toggle live autoscroll follow mode on or off.</td>
          </tr>
          <tr>
            <td><code>/</code></td>
            <td>Open substring search input.</td>
          </tr>
          <tr>
            <td><code>c</code></td>
            <td>Copy visible logs to clipboard via OSC 52.</td>
          </tr>
          <tr>
            <td><code>Enter</code> / <code>Space</code></td>
            <td>Open focused phase detail modal for comprehensive log inspection.</td>
          </tr>
          <tr>
            <td><code>?</code></td>
            <td>Toggle interactive help overlay.</td>
          </tr>
          <tr>
            <td><code>q</code> / <code>Ctrl+C</code></td>
            <td>Exit test runner cleanly.</td>
          </tr>
        </tbody>
      </table>
