  - id: "topic_03_viewport_scrolling_and_search"
    title: "Log Scrolling, Search & Clipboard Export"
    summary: "Real-time follow mode, substring pattern filtering, and OSC 52 system clipboard export."
    content: |
      #### Log Navigation Features

      - **Follow Mode (`f`)**: Automatically pins the viewport to the newest log entries. Pauses on manual scroll (`PageUp`/`PageDown`/`↑`/`↓`).
      - **In-Log Search (`/`)**: Opens live prompt to highlight and cycle through matching log lines.
      - **OSC 52 Clipboard Export (`c`)**: Copies selected log traces directly into the native OS system clipboard without external dependencies.

  - id: "topic_04_command_palette_and_keybindings"
    title: "Interactive Navigation & Keybindings"
    summary: "Complete keyboard shortcuts reference for test inspection and modal navigation."
    content: |
      <table>
        <thead>
          <tr>
            <th>Key</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><code>1</code> - <code>4</code></td>
