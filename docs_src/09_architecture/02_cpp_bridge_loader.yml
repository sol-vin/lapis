  - id: "topic_01_function_pointer_table"
    title: "The BridgeAPI Function Pointer Table"
    summary: "How Crystal receives direct Godot engine entry points."
    content: |
      During initialization, `crystal_bridge.cpp` populates a flat `BridgeAPI` structure containing direct function pointers to Godot engine entry points:
      - `gd_classdb_register_extension_class`
      - `gd_classdb_register_extension_class_method`
      - `gd_classdb_register_extension_class_property`
      - `gd_classdb_register_extension_class_signal`
      - `gd_variant_get_ptr_utility_function`

      When `crystal_godot_init(&g_bridge_api)` is called, Crystal stores these function pointers in `Godot::Bridge`, bypassing all C++ ABI name mangling and calling engine routines at raw C speed!
