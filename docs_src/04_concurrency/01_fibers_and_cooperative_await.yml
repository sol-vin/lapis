id: "A_FIBERS_AND_COOPERATIVE_AWAIT"
parent_module: "Lapis::Docs::D_CONCURRENCY_AND_FIBERS"
title: "Fibers & Cooperative Signal Awaiting"
summary: "Single-threaded scene loop orchestration, Fiber.yield, and non-blocking timers."
overview: |
  Comprehensive guide to running Crystal fibers in Godot's single-threaded scene loop,
  cooperative yielding, and avoiding the top-level sleep deadlock trap.
related_sources:
  - "**Concurrency Safety**: `src/libgodot/extensions/scene_tree.cr`"
  - "**Live Specs**: `spec/thread_safety_spec.cr`"

sections:
  - id: "topic_00_fiber_rules"
    title: "The Three Golden Fiber Invariants"
    summary: "Essential rules for writing asynchronous fiber code in LibGodot."
    type: "Array(String)"
    return_value:
      - "Rule 1: Godot owns the OS main loop; fibers must cooperatively yield via Fiber.yield"
      - "Rule 2: NEVER call top-level sleep in a fiber; Godot does not pump LibEvent"
      - "Rule 3: Use await(timer) or frame delta accumulators for time delays"

  - id: "topic_01_cooperative_yielding"
    title: "Yielding Execution in _process"
    summary: "Pumping spawned fibers cooperatively from the engine main thread."
    content: |
      Because Godot controls the OS event loop, spawned fibers (`spawn do ... end`) will starve unless the main thread cooperatively yields:

      ```crystal
      node GameManager < Node do
        def _ready : Void
          # Spawn a background gameplay fiber
          spawn do
            Godot.print("Dialog sequence started!")
            await(get_tree.create_timer(2.0))
            Godot.print("2 seconds elapsed non-blockingly!")
          end
        end

        def _process(delta : Float64) : Void
          # Cooperatively yield time slice to pending fibers:
          Fiber.yield
        end
      end
      ```

  - id: "topic_02_the_sleep_deadlock_hazard"
    title: "The Sleep Deadlock Hazard"
    summary: "Why sleep hangs in fibers and how to await timers safely."
    content: |
      #### The Hazard:
      In standard Crystal console programs, `sleep 2.seconds` registers a timer with Crystal's LibEvent / IOCP event loop. In LibGodot, Godot drives the main loop — not LibEvent! Calling top-level `sleep` suspends the fiber permanently, hanging that fiber indefinitely.

      #### The Safe Pattern:
      Always use Godot's timer mechanism with `await`:
      ```crystal
      # SAFE: Suspends fiber until Godot's timer fires
      await(get_tree.create_timer(1.5))
      ```

  - id: "topic_03_await_status_and_predicates"
    title: "AwaitStatus, Bang (!), and Predicate (?) Await Paradigms"
    summary: "Handling timeouts cleanly using AwaitStatus, exception-raising await!, and nilable/boolean await?."
    content: |
      LibGodot provides three complementary await idioms to distinguish between successful signal emissions and timeouts without ambiguous empty return values:

      <table>
        <thead>
          <tr>
            <th>Paradigm</th>
            <th>On Success</th>
            <th>On Timeout</th>
            <th>Primary Use Case</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><code>await(...)</code></td>
            <td><code>AwaitStatus(T).completed(val)</code></td>
            <td><code>AwaitStatus(T).timed_out</code></td>
            <td>Inspection via <code>status.completed?</code> or <code>status.timed_out?</code> without raising exceptions</td>
          </tr>
          <tr>
            <td><code>await!(...)</code></td>
            <td>Unwrapped <code>T</code> directly</td>
            <td>Raises <code>Godot::TimeoutError</code></td>
            <td>Fail-fast operations, strict handshakes, and turn-based RPC sequences</td>
          </tr>
          <tr>
            <td><code>await?(...)</code></td>
            <td><code>val</code> (or <code>true</code> for 0-arg/timers)</td>
            <td><code>nil</code> (or <code>false</code> for 0-arg/timers)</td>
            <td>Quick-time events (QTEs), guard checks, and non-raising optional reactions</td>
          </tr>
        </tbody>
      </table>

      #### 1. AwaitStatus Inspection (`await`):
      ```crystal
      status = await(boss.phase_changed, timeout_sec: 5.0)
      if status.completed?
        Godot.print("Boss entered phase: #{status.value!}")
      else
        Godot.print("Phase change timed out!")
      end
      ```

      #### 2. Fail-Fast Unwrapping (`await!`):
      ```crystal
      # Returns unwrapped tuple directly or raises Godot::TimeoutError
      score, bonus = node.level_scored.await!(timeout_sec: 10.0)
      ```

      #### 3. Nilable Predicates (`await?`):
      ```crystal
      # Returns true if parried in time, false if timed out
      if await?(player.parry_pressed, timeout_sec: 0.25)
        enemy.stagger!
      else
        player.take_damage(50)
      end
      ```

