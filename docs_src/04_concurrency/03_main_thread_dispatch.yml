  - id: "topic_01_on_main_thread"
    title: "Scheduling Work with Godot.on_main_thread"
    summary: "Enqueueing Crystal closures from background workers to mutate nodes safely."
    content: |
      When a background worker thread needs to create nodes or update the SceneTree:

      ```crystal
      Thread.new do
        heavy_procedural_texture = generate_terrain_noise

        # Safely hand off to main thread:
        Godot.on_main_thread do
          sprite = Godot.create(Godot::Sprite2D)
          sprite.texture = heavy_procedural_texture
          add_child(sprite) # SAFE: Dispatched on the engine main thread!
        end
      end
      ```

      #### How It Works:
      The queue is thread-safe and guarded by a `::Thread::Mutex`. On every frame during `_process` and `_physics_process`, `Godot::ThreadSafety.flush_main_thread_queue!` drains the queue and executes the closures on the main thread.
