  - id: "topic_01_build_command"
    title: "lapis build: Compilation Modes & Flags"
    summary: "Command syntax, compilation flags, release optimizations, and single-module options."
    content: |
      #### Usage:
      ```bash
      lapis build [target] [options]
      ```

      #### Common Options:
      | Option | Shorthand | Description |
      | :--- | :--- | :--- |
      | `--release` | `-r` | Compiles with `--release -O3` optimizations and strips debug symbols |
      | `--single-module` | `-m` | Compiles via a single LLVM module for maximum cross-module optimization |
      | `--clean` | `-c` | Removes previous build artifacts before compiling |
      | `--threads=N` | | Sets the number of parallel Crystal compilation threads |
      | `--error-trace` | | Prints full exception backtraces on compilation errors |

      #### Examples:
      ```bash
      lapis build game                # Fast incremental debug build of game.dll
      lapis build game -r             # Production release build
      lapis build standalone -r -m    # Optimized single-module standalone executable
      ```

  - id: "topic_02_sync_command"
    title: "lapis sync: Multi-Target Synchronization"
    summary: "Ensuring all consumer projects share identical binary deliverables and manifests."
    content: |
      In a monorepo or multi-project workspace, different projects (e.g. `examples/basic_demo`, `template/`, `performance/`) require runtime shared libraries and manifests:

      ```bash
      lapis sync [options]
      ```

      #### What `lapis sync` Performs:
      1. Verifies `bin/crystal_bridge.dll` and copies to consumer `bin/` directories.
      2. Validates runtime dependencies (`gc.dll`, `pcre2-8.dll`, `iconv-2.dll`, `libgodot.dll`).
      3. Synchronizes GDExtension manifests (`crystal.gdextension`).
      4. Enforces `.gdignore` placement inside `lib/` and output directories.
