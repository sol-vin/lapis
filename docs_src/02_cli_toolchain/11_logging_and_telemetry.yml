id: "K_LOGGING_AND_TELEMETRY"
parent_module: "Lapis::Docs::B_LAPIS_CLI_AND_TOOLCHAIN"
title: "Logging Framework & Telemetry"
summary: "Diagnostic logging with Godot.log, custom filters, BBCode console output, compile-time elision, and lapis log."
overview: |
  Comprehensive guide to the Lapis logging and telemetry apparatus, covering runtime severity levels,
  the metaprogrammed `define_log_filters` DSL, compile-time zero-cost log elision, and the `lapis log` CLI tool.
related_sources:
  - "**Logging Implementation**: `src/libgodot/logging/`"
  - "**Log CLI Command**: `tools/lapis/src/commands/log.cr`"
  - "**Specifications**: `spec/logging_spec.cr`"

sections:
  - id: "topic_00_logging_features"
    title: "Core Logging Capabilities"
    summary: "High-performance features of the Lapis diagnostic logging system."
    type: "Array(String)"
    return_value:
      - "Zero-Cost Compile-Time Elision: Unused logs produce 0 bytes in output binaries"
      - "Metaprogrammed Filter DSL: define_log_filters creates typed enum values and dispatchers"
      - "BBCode Console Formatting: Rich color highlights for Godot editor output dock"
      - "Structured Records: Captures timestamp, severity, tag, channel, callsite file and line"
      - "CLI Streaming & Inspection: lapis log tails, filters, and formats logs with ANSI colors"

  - id: "topic_01_godot_log_dsl"
    title: "Godot.log & Severity Levels"
    summary: "Writing structured log messages across standard severity levels."
    content: |
      Lapis provides built-in logging methods on `Godot`:

      ```crystal
      require "libgodot"

      # Standard logging methods:
      Godot.error("Failed to load map data", "LevelLoader")
      Godot.warn("High frame time detected: #{delta * 1000} ms")
      Godot.info("Player spawned at #{position}")
      Godot.debug("Velocity: #{velocity}")
      Godot.trace("Sub-frame physics iteration")
      ```

      Or via `Godot.log` with a level symbol or enum:
      ```crystal
      Godot.log :info, "Audio bus initialized"
      Godot.log Godot::LogLevel::Warn, "Texture cache nearing limit"
      ```

  - id: "topic_02_custom_filters_and_tags"
    title: "Custom Domain Filters & Tags"
    summary: "Declaring project-specific log categories using define_log_filters and log_filter."
    content: |
      Use `define_log_filters` to register domain-specific categories with custom BBCode hex colors and tags:

      ```crystal
      define_log_filters do
        filter :combat,    tag: "{combat}",    name_tag: "COMBAT",    color: "#ff5555"
        filter :ai,        tag: "{ai}",        name_tag: "AI",        color: "#50fa7b"
        filter :dialogue,  tag: "{dialogue}",  name_tag: "DIALOGUE",  color: "#bd93f9"
        filter :net,       tag: "{net}",       name_tag: "NETWORK",   color: "#8be9fd"
      end

      # In your gameplay nodes:
      Godot.log :combat, "Fireball dealt 45 damage to #{target.name}"
      Godot.log :dialogue, "NPC greeting started: 'Welcome stranger!'"
      ```

      Or declare a single filter directly at the top of a file:
      ```crystal
      log_filter :inventory, tag: "{inv}", name_tag: "INVENTORY", color: "#f1fa8c"
      ```

  - id: "topic_03_compile_time_elision"
    title: "Compile-Time Log Elision & Optimization"
    summary: "Stripping low-priority logs at compile time to eliminate string allocations."
    content: |
      In production builds or performance-sensitive loops, log formatting overhead must not impact frame rate.
      Lapis evaluates log statements through Crystal macros:

      - In `--release` builds, debug and trace logs are completely removed from the abstract syntax tree.
      - Expressions passed to `Godot.log` (such as string interpolations `"Value: #{expensive_calc}"`) are never executed if the log level is disabled.
      - You can specify a custom compile-time log threshold via compiler flag:
        ```bash
        crystal build src/main.cr -Dlog_level=warn
        ```

  - id: "topic_04_lapis_log_cli"
    title: "CLI Log Streaming with lapis log"
    summary: "Inspecting, streaming, and filtering game logs from the terminal."
    content: |
      Use the `lapis log` CLI command to monitor game execution:

      ```bash
      # Follow live game log output in real time
      lapis log --tail

      # Filter by minimum severity level
      lapis log --level=WARN

      # Filter by custom tag or channel
      lapis log --filter=combat

      # Output formatted with ANSI terminal escape colors
      lapis log --ansi

      # View the last 50 log records
      lapis log --lines=50
      ```
