sections:
  - id: "topic_00_key_features"
    title: "System Capabilities"
    summary: "Returns core capabilities and supported platforms for Lapis."
    type: "Array(String)"
    return_value:
      - "Full cross-platform support: Windows (x86_64), Linux (x86_64), macOS (arm64)"
