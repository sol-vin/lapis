  - id: "topic_01_writing_suites"
    title: "Authoring a Test Suite"
    summary: "Creating test suites in spec/suites/ with custom assertions."
    content: |
      ```crystal
      require "../spec_helper"

      test_suite "Combat Mechanics" do
        before_each do
          @player = Godot.create(Godot::CharacterBody2D)
        end

        after_each do
          @player.destroy if @player.alive?
        end

        test "player takes damage correctly" do
          combat = CombatSystem.new(@player)
          combat.apply_damage(20)
          combat.health.should eq(80)
        end
      end
      ```

  - id: "topic_02_zero_leak_verification"
    title: "Proving Zero Leaks with assert_no_leak"
    summary: "Using Godot's Performance monitors and Boehm GC to mathematically prove zero memory leaks."
    content: |
      Memory leaks are fatal in game development. Lapis provides `assert_no_leak`:

      ```crystal
      test "1,000 bullet spawns do not leak engine memory" do
        Lapis::Test.assert_no_leak(warmup: 5, iterations: 100) do
          bullet = Godot.create(Godot::Sprite2D)
          get_tree.root.add_child(bullet)
          bullet.queue_free
        end
      end
      ```

      #### How It Works:
      1. Runs warmup iterations to stabilize caches.
      2. Records initial `OBJECT_COUNT`, `OBJECT_NODE_COUNT`, and `MEMORY_STATIC`.
      3. Executes the test block across batch iterations.
      4. Forces `GC.collect` and pumps Godot frames to flush deferred deletions.
      5. Mathematically asserts that final object count exactly equals initial object count!
