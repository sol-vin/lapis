  - id: "topic_06_quantitative_zero_leak_verification"
    title: "Quantitative Zero Memory Leak Verification"
    summary: "Mathematical leak verification using Godot Performance monitors and Boehm GC."
    content: |
      Memory leaks are fatal in native game development. Lapis enforces quantitative zero-leak verification
      via `Lapis::Test.assert_no_leak`, leveraging Godot's internal engine performance monitors:

      ```crystal
      def assert_no_leak(max_delta_objects : Int32 = 0, name : String = "Operation", &block)
        5.times { Fiber.yield }
        GC.collect

        perf = Godot.performance
        initial_objects = perf.get_monitor(Godot::Performance::Monitor::ObjectCount).to_i64
        initial_nodes   = perf.get_monitor(Godot::Performance::Monitor::ObjectNodeCount).to_i64

        yield

        5.times { Fiber.yield }
        GC.collect

        final_objects = perf.get_monitor(Godot::Performance::Monitor::ObjectCount).to_i64
        final_nodes   = perf.get_monitor(Godot::Performance::Monitor::ObjectNodeCount).to_i64

        delta_objects = (final_objects - initial_objects).abs
        delta_nodes   = (final_nodes - initial_nodes).abs

        assert_lte delta_objects, max_delta_objects, "#{name}: Object leak detected!"
        assert_eq delta_nodes, 0, "#{name}: Node leak detected!"
      end
      ```

  - id: "topic_07_developer_commands_and_cli"
    title: "Developer Test Commands Reference"
    summary: "Reference guide for invoking tests via Make and the Lapis CLI."
    content: |
      <table>
        <thead>
          <tr>
            <th>Workflow</th>
            <th>Command</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Full Test Suite</strong></td>
            <td><code>make test</code> or <code>bin/lapis test</code></td>
            <td>Executes Specs, Tool Tests, Standalone, and Runtime Project.</td>
          </tr>
          <tr>
            <td><strong>Interactive TUI</strong></td>
            <td><code>bin/lapis test --tui</code> (or <code>make test TUI=1</code>)</td>
            <td>Launches double-buffered ANSI dashboard with live progress metrics.</td>
          </tr>
          <tr>
            <td><strong>Crystal Specs Only</strong></td>
            <td><code>make spec</code></td>
            <td>Runs Phase 1a and Phase 1b unit specifications.</td>
          </tr>
          <tr>
            <td><strong>Tool Tests Only</strong></td>
            <td><code>crystal spec spec/editor_driver_spec.cr</code></td>
            <td>Executes headless in-editor tool tests via EditorDriver.</td>
          </tr>
          <tr>
            <td><strong>Filter by Category</strong></td>
            <td><code>bin/lapis test -c "Concurrency"</code></td>
            <td>Runs only runtime test suites in the specified category.</td>
          </tr>
          <tr>
            <td><strong>Filter by Pattern</strong></td>
            <td><code>bin/lapis test -f "Signal"</code></td>
            <td>Runs only test cases whose names match the given regex pattern.</td>
          </tr>
        </tbody>
      </table>
