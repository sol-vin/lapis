title: "Exhaustive Multi-Tier Test Suite Inventory & Phase Guide"
summary: "Comprehensive directory of all 6 test phases, 84 modular runtime suites, 70 engine specs, 19 CLI specs, in-editor tool runners, and zero-leak invariants."
overview: |
  Comprehensive architectural inventory and reference manual for Lapis's multi-tier test infrastructure,
  spanning 1,260+ asserted test blocks across 6 execution phases, headless compiler specs, in-editor tool runners,
  standalone binary hosts, 84 modular runtime suites, and quantitative zero-leak verification.
