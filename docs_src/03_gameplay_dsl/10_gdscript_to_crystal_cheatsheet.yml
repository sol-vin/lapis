id: "J_GDSCRIPT_TO_CRYSTAL_CHEATSHEET"
parent_module: "Lapis::Docs::C_GAMEPLAY_AND_DECLARATIVE_DSL"
title: "GDScript to Crystal Migration Cheatsheet"
summary: "Exhaustive side-by-side cheatsheet mapping GDScript syntax to Crystal for Lapis."
overview: |
  Comprehensive conversion guide and syntax cheatsheet for migrating GDScript game logic
  into idiomatic, high-performance Crystal for Lapis.
related_sources:
  - "**Gameplay DSL**: `src/libgodot/macros.cr`"
  - "**Node Context**: `src/libgodot/node_context.cr`"
  - "**Live Specs**: `spec/suites/test_node_dsl.cr`"

sections:
  - id: "topic_00_cheatsheet_features"
    title: "Cheatsheet Core Topics"
    summary: "Class declarations, node resolution via ~, exports, signals, and lifecycle."
    type: "Array(String)"
    return_value:
      - "Class declarations: node, node2d, node3d, gdclass, gmodule"
      - "Node path & unique lookup: ~Sprite2D, ~\"path\", ~\"%unique\", ~.as(T)"
      - "Exported properties: @[Export], ranges, enums, file pickers"
      - "Signals: typed declarations and synthesized emit_<name> methods"
      - "Non-blocking awaiting: await(signal), await(duration), await(timer)"

  - id: "topic_01_syntax_matrix"
    title: "Complete Syntax Comparison Matrix"
    summary: "Side-by-side mapping of GDScript patterns to Lapis Crystal."
    content: |
      <table>
        <thead>
          <tr>
            <th align="left">GDScript Pattern</th>
            <th align="left">Crystal Equivalent</th>
            <th align="left">Architectural Notes</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><code>class_name Player extends CharacterBody2D</code></td>
            <td><code>node Player &lt; CharacterBody2D do</code></td>
            <td>Explicit parent class. Registers in Godot ClassDB.</td>
          </tr>
          <tr>
            <td><code>class_name GameManager extends Node</code></td>
            <td><code>node GameManager do</code></td>
            <td>Defaults automatically to Godot::Node.</td>
          </tr>
          <tr>
            <td><code>class_name Player2D extends Node2D</code></td>
            <td><code>node2d Player2D do</code></td>
            <td>Convenience DSL macro defaulting to Godot::Node2D.</td>
          </tr>
          <tr>
            <td><code>class_name Player3D extends Node3D</code></td>
            <td><code>node3d Player3D do</code></td>
            <td>Convenience DSL macro defaulting to Godot::Node3D.</td>
          </tr>
          <tr>
            <td><code>class_name ItemData extends Resource</code></td>
            <td><code>gdclass ItemData &lt; Godot::Resource do</code></td>
            <td>Registers custom Resource/RefCounted in ClassDB.</td>
          </tr>
          <tr>
            <td><code>$Sprite2D</code></td>
            <td><code>~Sprite2D</code></td>
            <td>Typed lookup of first child matching class in NodeContext.</td>
          </tr>
          <tr>
            <td><code>$&quot;Sprite2D&quot;</code></td>
            <td><code>~&quot;Sprite2D&quot;</code></td>
            <td>String relative path child resolution.</td>
          </tr>
          <tr>
            <td><code>$&quot;../Player&quot;</code></td>
            <td><code>~&quot;../Player&quot;</code></td>
            <td>Parent or sibling tree navigation.</td>
          </tr>
          <tr>
            <td><code>%&quot;HealthBar&quot;</code></td>
            <td><code>~&quot;%HealthBar&quot;</code></td>
            <td>Scene unique node resolution (% prefix).</td>
          </tr>
          <tr>
            <td><code>$SomeName as Player</code></td>
            <td><code>~&quot;SomeName&quot;.as(Player)</code></td>
            <td>Explicit casting to custom Crystal node class.</td>
          </tr>
          <tr>
            <td><code>get_node_or_null(&quot;Sprite2D&quot;)</code></td>
            <td><code>~Sprite2D?</code></td>
            <td>Nilable lookup returning typed Sprite2D? or nil.</td>
          </tr>
          <tr>
            <td><code>@export var speed: float = 300.0</code></td>
            <td><code>@[Export]<br>property speed : Float32 = 300.0_f32</code></td>
            <td>Exposes typed property to editor Inspector.</td>
          </tr>
          <tr>
            <td><code>@onready var sprite = $Sprite2D</code></td>
            <td><code>getter(sprite) { ~Sprite2D }</code></td>
            <td>Lazy memoized getter resolving child on first access.</td>
          </tr>
          <tr>
            <td><code>signal health_changed(curr, max)</code></td>
            <td><code>signal health_changed(current : Int32, max : Int32)</code></td>
            <td>Synthesizes type-safe emit_health_changed method.</td>
          </tr>
          <tr>
            <td><code>await get_tree().create_timer(1.0).timeout</code></td>
            <td><code>await(1.0)</code></td>
            <td>Non-blocking signal awaiting without stopping engine loop.</td>
          </tr>
          <tr>
            <td><code>await enemy.died</code></td>
            <td><code>await(enemy.died)</code></td>
            <td>First-class bound signal awaiting with optional timeout.</td>
          </tr>
          <tr>
            <td><code>queue_free()</code></td>
            <td><code>queue_free</code></td>
            <td>Deferred deletion by engine at frame end.</td>
          </tr>
        </tbody>
      </table>

  - id: "topic_02_class_declarations"
    title: "Class Declaration DSL Variants"
    summary: "node, node2d, node3d, gdclass, and gmodule."
    content: |
      Lapis supports 5 declarative class and module macros:

      ```crystal
      # 1. Explicit inheritance from any Godot engine node
      node Player < CharacterBody2D do
        @[Export]
        property speed : Float32 = 250.0_f32
      end

      # 2. Shorthand defaulting to Godot::Node
      node GameManager do
        property score : Int32 = 0
      end

      # 3. Shorthand for 2D nodes (defaults to Godot::Node2D)
      node2d Bullet do
        property velocity : Vector2 = Vector2.new(10.0_f32, 0.0_f32)
      end

      # 4. Shorthand for 3D spatial nodes (defaults to Godot::Node3D)
      node3d Turret do
        property range : Float32 = 15.0_f32
      end

      # 5. Non-Node ClassDB classes (Resources, RefCounted)
      gdclass SkillData < Godot::Resource do
        @[Export]
        property cooldown : Float32 = 2.5_f32
      end

      # 6. Reusable mixin modules with exported properties and signals
      gmodule DamageableMixin do
        @[Export]
        property armor : Int32 = 5
        signal damaged(amount : Int32)
      end
      ```

  - id: "topic_03_unary_tilde_node_resolution"
    title: "Node Resolution with Unary ~"
    summary: "Matching GDScript's $ and % shorthands using Crystal's unary ~ operator."
    content: |
      In GDScript, nodes are retrieved using `$` and `%`. In Lapis, use the unary `~` operator:

      ```crystal
      def _ready : Void
        # Typed lookup of child node
        sprite = ~AnimatedSprite2D

        # Path lookup
        hitbox = ~"HitboxArea/CollisionShape2D"

        # Tree navigation
        parent_mgr = ~"../GameManager"

        # Scene unique node
        health = ~"%HealthBar"

        # Explicit downcasting to custom user class
        player = ~"../Player".as(Player)
        bar = ~"%HealthBar".as(ProgressBar)

        # Nilable lookup (returns nil if child absent)
        optional_light = ~PointLight2D?
      end
      ```

  - id: "topic_04_memory_safety"
    title: "Memory Safety & Dead-Pointer Defense"
    summary: "queue_free vs .destroy and #alive? defensive checks."
    content: |
      GDScript uses reference counting and garbage-collected variants, while Godot nodes are C++ instances.

      1. **Nodes in SceneTree**: Call `node.queue_free` to let Godot deallocate them cleanly at frame end.
      2. **Unparented Nodes**: Standalone nodes created via `Godot.create(Node2D)` MUST be cleaned up via `node.destroy` if they are never added to the SceneTree.
      3. **Defensive Checks**: When retaining references to enemies or bullets, check `#alive?` before accessing them to avoid segmentation faults.
