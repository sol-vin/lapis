  - id: "topic_01_node_declaration"
    title: "Node Declaration Syntax"
    summary: "Declaring custom nodes inheriting from 2D, 3D, UI, or Server nodes."
    content: |
      Declare a custom Godot node using the `node` macro:

      ```crystal
      require "libgodot"

      node Enemy < CharacterBody2D do
        @[Export]
        property max_health : Int32 = 100

        def _ready : Void
          Godot.print("Enemy #{name} ready!")
        end
      end
      ```

      #### Supported Parent Classes:
      You can inherit from any registered Godot engine node:
      - **2D Nodes**: `Node2D`, `Sprite2D`, `CharacterBody2D`, `Area2D`, `RigidBody2D`
      - **3D Nodes**: `Node3D`, `MeshInstance3D`, `CharacterBody3D`, `Camera3D`
      - **UI Controls**: `Control`, `Label`, `Button`, `Panel`, `ProgressBar`
      - **Servers**: Direct RID manipulation with `RenderingServer`, `PhysicsServer2D`

  - id: "topic_02_lifecycle_methods"
    title: "Engine Lifecycle Virtual Methods"
    summary: "Virtual methods invoked by the Godot scene tree during execution."
    content: |
      Godot dispatches lifecycle callbacks to custom nodes:

      <table>
        <thead>
          <tr>
            <th>Virtual Method</th>
            <th>Invocation Timing</th>
            <th>Typical Use Case</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><code>_enter_tree : Void</code></td>
            <td>When node enters active scene tree</td>
            <td>Subscribing to signals, global lookups</td>
          </tr>
          <tr>
            <td><code>_ready : Void</code></td>
            <td>When node and all children enter tree</td>
            <td>Initialization, setting initial positions</td>
          </tr>
          <tr>
            <td><code>_process(delta : Float64) : Void</code></td>
            <td>Every visual render frame</td>
            <td>Smooth visuals, UI updates, animations</td>
          </tr>
          <tr>
            <td><code>_physics_process(delta : Float64) : Void</code></td>
            <td>Fixed-rate physics step (60 Hz)</td>
            <td>Movement, raycasts, collision calculations</td>
          </tr>
          <tr>
            <td><code>_exit_tree : Void</code></td>
            <td>When node leaves active scene tree</td>
            <td>Cleanup, unregistering listeners</td>
          </tr>
        </tbody>
      </table>

  - id: "topic_03_tool_scripts"
    title: "In-Editor Tool Scripts (@[Tool])"
    summary: "Executing Crystal code live inside the Godot Editor viewport and scene dock."
    content: |
      Annotate a class with `@[Tool]` to have it execute inside the Godot Editor:

      ```crystal
      @[Tool]
      node LevelGenerator < Node2D do
        @[ExportToolButton("Generate Maze")]
        property generate_button : ToolButton do
          generate_level!
        end

        def generate_level! : Void
          Godot.print("Procedural generation running in Godot Editor!")
        end
      end
      ```

      When selected in the editor, clicking the inspector tool button executes the Crystal code live in the viewport!

  - id: "topic_04_node_helpers"
    title: "Ergonomic Node Declarations & Groups"
    summary: "Convenient macros for groups, cached node references, and unique scene access."
    content: |
      Lapis provides built-in macros for declarative scene setup directly inside the `node` block:

      ```crystal
      node Player < CharacterBody2D do
        # Declarative group membership
        group "players", "damageable"

        # Cached node references (typed and nilable variants)
        onready sprite : Sprite2D
        onready? particle_fx : CPUParticles2D

        # Scene Unique Node access (%UniqueNodeName)
        unique_node health_bar : ProgressBar
        unique_node? quest_tracker : Control
      end
      ```
