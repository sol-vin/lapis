title: "Declarative Node DSL & Lifecycle"
summary: "Authoring Godot nodes with the node ClassName < ParentNode syntax and virtual methods."
overview: |
  Comprehensive guide to authoring gameplay entities using Lapis's declarative Node DSL,
  ClassDB registration, and engine lifecycle virtual methods.
