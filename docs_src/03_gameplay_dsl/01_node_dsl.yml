sections:
  - id: "topic_00_dsl_features"
    title: "Core DSL Features"
    summary: "Declarative class registration, export properties, typed signals, and in-editor tool execution."
    type: "Array(String)"
    return_value:
      - "Declarative syntax: node ClassName < ParentNode do ... end"
      - "Automatic ClassDB engine registration"
      - "Virtual method overrides: _ready, _process, _physics_process, _enter_tree, _exit_tree"
