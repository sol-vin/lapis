  - id: "topic_01_signal_declaration"
    title: "Declaring & Emitting Signals"
    summary: "Declaring signals and calling generated type-safe emit methods."
    content: |
      Declare signals using the `signal` macro inside any `node`:

      ```crystal
      node HealthSystem < Node do
        # Signal with typed parameters
        signal health_changed(current : Int32, max : Int32)

        # Parameterless signal
        signal died

        property current_hp : Int32 = 100
        property max_hp : Int32 = 100

        def take_damage(amount : Int32) : Void
          @current_hp = (@current_hp - amount).clamp(0, @max_hp)

          # Call ergonomic emit helper (or synthesized emit_<name>):
          emit(health_changed, @current_hp, @max_hp)

          if @current_hp <= 0
            emit(died)
          end
        end
      end
      ```

  - id: "topic_02_connecting_signals"
    title: "Connecting Signals in Crystal & GDScript"
    summary: "Subscribing to signals across Crystal nodes and GDScript scripts."
    content: |
      #### Connecting in Crystal:
      ```crystal
      # Connect with a block directly on first-class bound signals:
      player.died.connect do
        Godot.print("Player has perished!")
      end

      # Typed signal callbacks receive arguments:
      player.health_changed.connect do |args|
        Godot.print("Health updated: #{args[0]} / #{args[1]}")
      end
      ```

      #### Connecting in GDScript:
      ```gdscript
      func _ready():
          var player = $Player
          player.health_changed.connect(_on_health_changed)

      func _on_health_changed(current: int, max_hp: int):
          print("Player health: ", current, "/", max_hp)
      ```

  - id: "topic_03_awaiting_signals"
    title: "Cooperative Signal Awaiting (await)"
    summary: "Suspending gameplay fibers non-blockingly until a signal arrives or times out."
    content: |
      Lapis supports first-class cooperative signal awaiting without blocking the engine main loop:

      ```crystal
      # Suspend until enemy dies:
      await(enemy.died)

      # Await with timeout (raises TimeoutError or returns nil):
      await(boss.defeated, timeout_sec: 10.0)

      # Awaiting a timer:
      timer = get_tree.create_timer(2.0)
      await(timer.timeout)
      ```
