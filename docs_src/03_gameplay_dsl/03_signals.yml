title: "Signals & Event-Driven Architecture"
summary: "Declaring signals, synthesized emit helpers, GDScript connections, and cooperative awaiting."
overview: |
  Comprehensive guide to Godot's reactive event system in Crystal, covering declaration,
  emission, inter-language connections, and cooperative signal awaiting with `await`.
