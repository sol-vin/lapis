  - id: "topic_00_signal_features"
    title: "Signal Capabilities"
    summary: "Type-safe signal emission, reflection, and cooperative fiber suspension."
    type: "Array(String)"
    return_value:
      - "Declarative syntax: signal name(arg1 : Type1, arg2 : Type2)"
