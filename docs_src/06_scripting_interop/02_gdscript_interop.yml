  - id: "topic_01_typed_project_bindings"
    title: "Automated Typed Project Bindings (lapis bind)"
    summary: "Generating strongly-typed Crystal wrappers for GDScript custom nodes."
    content: |
      When you run:
      ```bash
      lapis bind
      ```
      Lapis inspects all `.gd` scripts in your project and generates typed Crystal wrapper classes under `src/generated/project_nodes/`.

      #### Calling GDScript from Crystal:
      ```crystal
      # Strongly typed GDScript interop:
      inventory = get_node("Inventory").as(GDScript::InventorySystem)
      inventory.add_item("potion_health", 5) # Type-checked at compile time!
      ```

      #### Calling Crystal from GDScript:
      ```gdscript
      var player = $Player # Crystal node registered in ClassDB
      player.take_damage(25) # Calls Crystal def take_damage directly!
      ```
