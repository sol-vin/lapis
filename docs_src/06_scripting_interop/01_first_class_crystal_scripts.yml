  - id: "topic_01_attaching_scripts"
    title: "Attaching .cr Scripts to Nodes"
    summary: "Creating and attaching Crystal scripts via the Godot Editor UI."
    content: |
      1. In Godot's Scene dock, right click any node and select **Attach Script**.
      2. In the Language dropdown, select **Crystal** (`.cr`).
      3. Godot automatically creates the `.cr` file with proper node template and attaches it to the node.
      4. Double-click the script to open it in Godot's built-in Script Editor!
