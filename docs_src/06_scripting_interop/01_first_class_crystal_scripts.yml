title: "First-Class Crystal Scripts in Godot Editor"
summary: "Writing .cr files directly inside Godot Script Editor with native syntax highlighting and Crystalline LSP."
overview: |
  Comprehensive guide to Lapis's first-class scripting engine, enabling developers to write,
  attach, and edit `.cr` scripts inside the Godot Editor exactly like GDScript or C#.
