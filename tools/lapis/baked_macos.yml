# Lapis Multi-Volume Baked Files Manifest for macOS
# Embedded into the macOS lapis CLI binary at compile time via Bakelite.

volumes:
  engine:
    mount: ""
    default_chunk_size: 65536
    default_compression: deflate
    auto_threshold: 16384
    files:
      - src/libgodot.cr
      - src/lapis.cr
      - src/libgodot/**/*.cr
      - src/bridge/**/*
      - shard.yml
      - godot-version.yml
    exclude:
      - src/main.cr
      - "**/*.uid"
      - "**/*.import"
      - "**/*.log"
      - "**/*.dll"
      - "**/*.pdb"
      - "**/*.exe"
      - "**/*.dylib"

  template:
    mount: "template"
    files:
      - template/**/*
      - template/.gitignore
      - template/.github/**/*
      - template/.githooks/**/*
    exclude:
      - "**/*.uid"
      - "**/*.import"
      - "**/*.log"
      - "**/*.dll"
      - "**/*.pdb"
      - "**/*.exe"
      - "**/*.so"
      - "**/*.dylib"
      - "**/*.lib"
      - "**/*.a"
      - "**/bin/**"
      - "**/lib/**"
      - "**/.godot/**"

  addon_template:
    mount: "template-addon"
    files:
      - template-addon/**/*
      - template-addon/.gitignore
      - template-addon/.github/**/*
      - template-addon/.githooks/**/*
    exclude:
      - "**/*.uid"
      - "**/*.import"
      - "**/*.log"
      - "**/*.dll"
      - "**/*.pdb"
      - "**/*.exe"
      - "**/*.so"
      - "**/*.dylib"
      - "**/*.lib"
      - "**/*.a"
      - "**/bin/**"
      - "**/lib/**"
      - "**/.godot/**"

  addon:
    mount: "addons/crystal_integration"
    files:
      - addons/crystal_integration/**/*
    exclude:
      - "**/*.uid"
      - "**/*.import"
      - "**/*.log"
      - "**/*.dll"
      - "**/*.pdb"
      - "**/*.exe"
      - "**/*.so"
      - "**/*.dylib"
      - "**/*.lib"
      - "**/*.a"
      - "**/bin/**"
      - "**/.godot/**"
