# Lapis Baked Files Manifest for macOS
# Strictly lists all static assets embedded into the macOS lapis CLI binary at compile time.

files:
  # 1. Authoritative Engine Configuration
  - godot-version.yml
  - shard.yml

  # 2. Starter Game Template (template/)
  - template/**/*
  - template/.gitignore
  - template/.github/**/*
  - template/.githooks/**/*

  # 3. Addon Files (addons/crystal_integration/)
  - addons/crystal_integration/**/*

  # 4. Starter Addon Template (template-addon/)
  - template-addon/**/*
  - template-addon/.gitignore
  - template-addon/.github/**/*
  - template-addon/.githooks/**/*

  # 5. Core Library Source (baked for offline / zero-dependency extraction)
  - src/libgodot.cr
  - src/lapis.cr
  - src/libgodot/**/*.cr
  - src/bridge/**/*
