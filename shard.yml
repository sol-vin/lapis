name: lapis
version: 0.0.5
crystal: ">= 1.20.0, <= 1.21.0"

authors:
  - Ian

description: |
  Lapis: High-performance Crystal bindings and 2-way host integration for Godot Engine 4.8+ using LibGodot and GDExtension.

crystalline:
  main: src/main.cr

targets:
  lapis:
    main: tools/lapis/src/lapis.cr
  game:
    main: src/main.cr
  libgodot:
    main: src/libgodot.cr

license: MIT

dependencies:
  cradare2:
    github: sol-vin/cradare2
    branch: master
  opal:
    github: sol-vin/opal
    branch: main
  jasper:
    github: sol-vin/jasper
    branch: main
  carbon:
    github: sol-vin/carbon
    branch: main
